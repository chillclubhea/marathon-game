<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>馬拉松第一天：喚醒你的代謝！</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
        color: #5A4A42;
    }
    .container {
        max-width: 800px;
        margin: 20px auto;
        background-color: #f2e9de;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
        color: #5A4A42;
        text-align: center;
        margin-bottom: 20px;
    }
    .section {
        background-color: #fff8f0;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        border: 1px solid #e8ded3;
    }
    .section-title {
        font-size: 20px;
        font-weight: bold;
        color: #5A4A42;
        margin-bottom: 15px;
        text-align: center;
    }
    .content-flex {
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
    }
    .content-item {
        text-align: center;
        flex: 1 1 30%;
        margin: 10px;
    }
    .content-item img {
        max-width: 80px;
        margin-bottom: 10px;
    }
    .content-item h3 {
        color: #5A4A42;
        margin: 10px 0 5px;
        font-size: 16px;
    }
    .content-item p {
        color: #5A4A42;
        font-size: 14px;
        line-height: 1.5;
    }
    .key-point {
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        color: #5A4A42;
        margin: 20px 0;
    }
    .comparison {
        display: flex;
        justify-content: space-around;
        align-items: center;
        text-align: center;
    }
    .comparison-item {
        flex: 1;
        padding: 10px;
    }
    .comparison-item img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        margin-bottom: 10px;
    }
    .comparison-label {
        font-size: 16px;
        font-weight: bold;
        padding: 5px 15px;
        border-radius: 20px;
        display: inline-block;
        margin-top: 10px;
    }
    .label-bad {
        background-color: #f5c6cb;
        color: #721c24;
    }
    .label-good {
        background-color: #c3e6cb;
        color: #155724;
    }
    .practical-tips {
        text-align: center;
        padding: 20px;
        border-top: 1px solid #e8ded3;
    }
    .practical-tips h3 {
        color: #5A4A42;
        margin-bottom: 10px;
    }
    .practical-tips p {
        font-size: 16px;
        margin: 5px 0;
        color: #5A4A42;
    }
    .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #888;
    }
</style>
</head>
<body>

<div class="container">
    <h1>為什麼奶昔能「喚醒代謝」？</h1>

    <div class="section content-flex">
        <div class="content-item">
            <img src="https://i.imgur.com/8QZ4Y2x.png" alt="蛋白質基礎"> <h3>蛋白質基礎：</h3>
            <p>維持肌肉量，提升靜息代謝率。</p>
        </div>
        <div class="content-item">
            <img src="https://i.imgur.com/1J1H3c2.png" alt="114種營養"> <h3>114種營養：</h3>
            <p>補足微量元素，讓生化反應不卡關。</p>
        </div>
        <div class="content-item">
            <img src="https://i.imgur.com/0Q4X6Z1.png" alt="熱量赤字"> <h3>熱量赤字：</h3>
            <p>不用捱餓，就能創造減重空間。</p>
        </div>
    </div>

    <div class="section">
        <div class="section-title">大家早安！為什麼第一餐喝奶昔是「喚醒代謝」的關鍵？</div>
        <p style="text-align: center; margin-bottom: 20px;">別讓劣質早餐拖累妳的燃脂進度！</p>
        <div class="comparison">
            <div class="comparison-item">
                <img src="https://i.imgur.com/a5b8g2K.png" alt="劣質早餐"> <span class="comparison-label label-bad">劣質充電器</span>
            </div>
            <div class="comparison-item">
                <img src="https://i.imgur.com/7u5j0A6.png" alt="奶昔早餐"> <span class="comparison-label label-good">超級快充</span>
            </div>
        </div>
        <p class="key-point">馬拉松第一天，從「超級快充」開始！</p>
    </div>

    <div class="section">
        <div class="section-title">慢口喝，是為了「全吸收」！</div>
        <div class="practical-tips">
            <h3>實戰指令</h3>
            <p>• 不要乾杯！像品嚐紅酒一樣慢口喝。</p>
            <p>• 讓唾液澱粉酶充分混合。</p>
        </div>
        <p class="key-point">今天，讓我們一起吃出「易瘦體質」！</p>
    </div>

    <div class="footer">
        @馬拉松
    </div>
</div>

</body>
</html>
