<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日健康資訊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .day-badge { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        /* 優化捲動條外觀 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="bg-white p-4">
    <div id="contentBox" class="text-center">
        <div class="inline-block day-badge text-white px-4 py-1 rounded-full text-xs font-bold mb-4">
            DAY <span id="displayDay">1</span>
        </div>
        
        <h2 id="infoTitle" class="text-xl font-black text-gray-800 mb-4">載入中...</h2>
        
        <div id="infoImage" class="mb-6 space-y-3">
            </div>

        <div class="text-left bg-gray-50 p-4 rounded-2xl border border-gray-100 mb-4">
            <p id="infoText" class="text-gray-600 text-sm leading-relaxed mb-4"></p>
            
            <div class="bg-blue-50 p-3 rounded-xl border-l-4 border-blue-400">
                <p class="text-[10px] font-bold text-blue-800">💡 管理師建議：</p>
                <p id="infoTips" class="text-xs text-blue-700 mt-1"></p>
            </div>
        </div>
    </div>

    <script>
        const DAILY_CONTENT = {
            1: { 
                title: "🌱 第一天：啟動細胞營養", 
                content: "歡迎來到挑戰！減重 80% 靠營養，今天起我們用「三杯水」開啟代謝：蘆薈汁清、草本茶調、奶昔補。", 
                tips: "早起先喝 3 瓶蓋蘆薈汁兌水，喚醒腸道吸收力！",
                images: ["https://scontent-den2-1.xx.fbcdn.net/v/t39.30808-6/608943728_122113845339083581_1013822433400309860_n.jpg?_nc_cat=102&ccb=1-7&_nc_sid=127cfc&_nc_ohc=cZOczSUjK-4Q7kNvwGbSDo1&_nc_oc=Adk5cjRKkt8Qbpa1p5XIBLc8rZ35NuZXwH7lGmrcIshwYhELTQ-o0WOmQRob5OCjies&_nc_zt=23&_nc_ht=scontent-den2-1.xx&_nc_gid=fPFROfdF1x0Ufa26Tam5sg&oh=00_AfpQpmii5umhnECfZ3xzPG-Rr56gcKZltPn--R2adgXfvA&oe=695C8476"]
            },
            2: { 
                title: "🌙 第二天：睡眠竟然也能瘦？", 
                content: "熬夜會分泌「皮質醇」（壓力荷爾蒙），它最鍾意叫身體囤積脂肪，特別係腹部贅肉！相反，乖乖睡覺會分泌「瘦體素」，像勤力的清潔員在睡眠中幫你燒脂。", 
                tips: "今日行動：今晚 11 點前「強制登出」手機，睡滿 7 小時！",
                images: [
                    "https://scontent-den2-1.xx.fbcdn.net/v/t39.30808-6/610874102_122113845219083581_5961567971867320995_n.jpg?_nc_cat=108&ccb=1-7&_nc_sid=127cfc&_nc_ohc=JKyIHmyjIzgQ7kNvwEVK1b3&_nc_oc=Adn9DHSsNxpGpfRHEHaZAKekZXwK1lwj5Jr8eLipmNxfPRk87eKJwDsn4dFVuPb9z0w&_nc_zt=23&_nc_ht=scontent-den2-1.xx&_nc_gid=_Lv4RtBVjOJW-uy25BgfzA&oh=00_AfrjYGCyVcLhLJbcYtZS1UYp_HXu-scnrb6ArAvdZJsxGw&oe=695C864D",
                    "https://scontent-den2-1.xx.fbcdn.net/v/t39.30808-6/609028759_122113845231083581_6456089853283612139_n.jpg?_nc_cat=105&ccb=1-7&_nc_sid=127cfc&_nc_ohc=bjRSgJggMQgQ7kNvwFGZxiM&_nc_oc=AdnKIGpOx5pU0n46vaAfh7v3Dv9RqY6CQHZNXTPt03awRMiV6nQitXW2uxsIsUKjTho&_nc_zt=23&_nc_ht=scontent-den2-1.xx&_nc_gid=UIHGt8x9Q61EeJg_eD2vQw&oh=00_AfoWjfSu33c0Kh2JAYbFoemuuMMDnclo18MJppDFguXWFQ&oe=695C6D04"
                ]
            },
            3: { 
                title: "💧 第三天：水是脂肪的搬運工", 
                content: "沒有水，脂肪就排不出去。草本茶能幫助提升代謝率，相當於跑步的燃脂效果。", 
                tips: "今天目標：喝足 3000cc 水分（體重 x 45-50ml）。",
                images: [] 
            },
            4: { 
                title: "🍎 第四天：認識「偽食慾」", 
                content: "大腦有時分不清楚「渴」與「餓」。當你想吃甜點時，其實你是缺水或缺營養了。", 
                tips: "想吃零食前，先喝 200ml 草本茶，等 10 分鐘看看！",
                images: []
            },
            5: { 
                title: "💩 第五天：腸道排毒日", 
                content: "如果排便不順，體重會卡關。活動纖維粉是腸道的掃把，能幫你帶走垃圾。", 
                tips: "今天可以在奶昔中加入一匙活動纖維粉，增加纖維攝取。",
                images: []
            },
            6: { 
                title: "💤 第六天：睡眠與皮質醇", 
                content: "熬夜會讓皮質醇上升，這是一種會抓取腹部脂肪的荷爾蒙。睡得好，瘦得快。", 
                tips: "今晚嘗試 11 點前關燈，睡前 1 小時不要看手機。",
                images: []
            },
            7: { 
                title: "📊 第七天：第一週小結", 
                content: "恭喜堅持一週！體重計數字可能波動，但請觀察衣服有沒有變鬆？那才是真的脂肪減少。", 
                tips: "今天給自己一個讚美，紀錄下這週體力變好的時刻。",
                images: []
            },
            8: { 
                title: "🍳 第八天：正餐怎麼吃？", 
                content: "午餐建議採用「拳頭原則」：一拳頭蛋白質、一拳頭澱粉、兩拳頭蔬菜。", 
                tips: "避免勾芡與油炸，原型食物是你的好朋友。",
                images: []
            },
            9: { 
                title: "🌙 第九天：夜間代謝力", 
                content: "睡覺時也能燃脂？夜寧新含有精胺酸，能維持血管健康並在夜間持續優化循環。", 
                tips: "睡前喝一杯夜寧新，給心血管最好的保護。",
                images: []
            },
            10: { 
                title: "🔥 第十天：突破平台期", 
                content: "身體會適應熱量，如果體動不動了，試著增加 10 分鐘的高強度運動或增加飲水量。", 
                tips: "今天加強草本茶的濃度，幫代謝推一把！",
                images: []
            }
        };

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const day = parseInt(urlParams.get('day')) || 1;
            
            const data = DAILY_CONTENT[day] || DAILY_CONTENT[1];
            
            // 渲染基本文字
            document.getElementById('displayDay').innerText = day;
            document.getElementById('infoTitle').innerText = data.title;
            document.getElementById('infoText').innerText = data.content;
            document.getElementById('infoTips').innerText = data.tips;

            // 渲染圖片
            const imgContainer = document.getElementById('infoImage');
            if (data.images && data.images.length > 0) {
                imgContainer.innerHTML = data.images.map(url => 
                    `<img src="${url}" class="w-full rounded-2xl shadow-md border border-gray-100" onerror="this.style.display='none'">`
                ).join('');
            } else {
                imgContainer.innerHTML = ''; // 如果沒圖片就清空
            }
        }
    </script>
</body>
</html>
