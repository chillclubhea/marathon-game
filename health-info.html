<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .day-badge { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="bg-white p-4">
    <div id="contentBox" class="text-center">
        <div class="inline-block day-badge text-white px-4 py-1 rounded-full text-xs font-bold mb-4">
            DAY <span id="displayDay">1</span>
        </div>
        
        <h2 id="infoTitle" class="text-xl font-black text-gray-800 mb-4">載入中...</h2>
        
        <div id="infoImage" class="mb-6 rounded-2xl overflow-hidden shadow-sm">
            </div>

        <div class="text-left bg-gray-50 p-4 rounded-2xl border border-gray-100">
            <p id="infoText" class="text-gray-600 text-sm leading-relaxed mb-4"></p>
            <div class="bg-blue-50 p-3 rounded-xl border-l-4 border-blue-400">
                <p class="text-[10px] font-bold text-blue-800">💡 管理師建議：</p>
                <p id="infoTips" class="text-xs text-blue-700 mt-1"></p>
            </div>
        </div>
    </div>

    <script>
        const DAILY_CONTENT = {
            1: { title: "建立「三杯水」節奏", content: "第一天我們練習：清、調、補。早上蘆薈汁清理、全天草本茶代謝、早晚奶昔補充營養。", tips: "今天請確保喝水量達到體重 x 45cc。" },
            2: { title: "蛋白質是燃脂引擎", content: "沒有蛋白質就沒有肌肉，沒有肌肉代謝就會下降。這就是為什麼 PPP 蛋白質粉這麼重要。", tips: "試著在早上的奶昔多加 1 匙蛋白質粉。" },
            3: { title: "對抗偽食慾", content: "有時候想吃東西不是餓，是渴！喝杯草本茶，等 10 分鐘，你會發現食慾消失了。", tips: "下午 3 點是誘惑最大的時候，喝杯大杯草本茶吧。" },
            // ...以此類推
        };

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const day = urlParams.get('day') || 1; // 預設第 1 天
            
            const data = DAILY_CONTENT[day] || DAILY_CONTENT[1];
            
            document.getElementById('displayDay').innerText = day;
            document.getElementById('infoTitle').innerText = data.title;
            document.getElementById('infoText').innerText = data.content;
            document.getElementById('infoTips').innerText = data.tips;

            // 根據天數動態插入圖片
            if(day == 1) {
                document.getElementById('infoImage').innerHTML = '';
            } else if(day == 2) {
                document.getElementById('infoImage').innerHTML = '';
            }
        }
    </script>
</body>
</html>
