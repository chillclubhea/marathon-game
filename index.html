<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馬拉松遊戲 - 體重登記系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">🏃‍♂️ 馬拉松挑戰登記</h1>

        <section class="mb-8 border-b pb-6">
            <h2 class="text-xl font-semibold mb-4">1. 成員資料設定</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">姓名</label>
                    <input type="text" id="username" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="請輸入姓名">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">角色</label>
                    <select id="role" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        <option value="student">學員</option>
                        <option value="captain">隊長</option>
                        <option value="vice_captain">副隊長</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">選擇計畫</label>
                    <select id="plan" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        <option value="A">計畫 A (減脂)</option>
                        <option value="B">計畫 B (增肌)</option>
                    </select>
                </div>
                <button onclick="registerUser()" class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded hover:bg-green-600 transition">
                    完成登記
                </button>
            </div>

            <section class="mt-8">
                <h2 class="text-xl font-semibold mb-4 text-center text-orange-600">🏆 九宮格即時戰報</h2>
                <div id="gridContainer" class="grid grid-cols-3 gap-2 bg-gray-200 p-2 rounded-lg">
                    
                </div>
                <button onclick="refreshGrid()" class="w-full mt-4 bg-gray-600 text-white py-2 rounded shadow">
        更新數據
    </button>
</section>
        </section>

        <section>
            <h2 class="text-xl font-semibold mb-4">2. 每日體重登記</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">今日體重 (kg)</label>
                    <input type="number" id="currentWeight" step="0.1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="例如: 70.5">
                </div>
                <button onclick="submitWeight()" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600 transition">
                    送出今日成績
                </button>
            </div>
        </section>

        <div id="statusMsg" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        // --- 這裡請填入你的 Supabase 資訊 (確保只會出現這一次) ---
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';

        // 初始化 Supabase Client
        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        // 顯示訊息的小工具
        function showMsg(text, isError = false) {
            const msgEl = document.getElementById('statusMsg');
            msgEl.innerText = text;
            msgEl.className = isError ? "mt-4 text-center text-red-500" : "mt-4 text-center text-green-500";
        }
        async function refreshGrid() {
    const gridContainer = document.getElementById('gridContainer');
    gridContainer.innerHTML = '讀取中...';

    // 1. 抓取所有成員
    const { data: members, error: profileErr } = await _client
        .from('profiles')
        .select('*')
        .limit(9); // 只抓前 9 人

    if (profileErr) return showMsg("讀取成員失敗", true);

    gridContainer.innerHTML = ''; // 清空

    // 2. 針對每一位成員，抓取最新體重
    for (let i = 0; i < 9; i++) {
        const member = members[i];
        const card = document.createElement('div');
        card.className = "bg-white aspect-square flex flex-col items-center justify-center p-2 rounded shadow text-center border-2 border-transparent";
        
        if (member) {
            // 抓取該學員最新的一筆體重
            const { data: logs } = await _client
                .from('weight_logs')
                .select('weight')
                .eq('user_id', member.id)
                .order('created_at', { ascending: false })
                .limit(1);

            const latestWeight = logs && logs[0] ? logs[0].weight + 'kg' : '未量測';
            
            card.innerHTML = `
                <div class="font-bold text-blue-800">${member.username}</div>
                <div class="text-xs text-gray-500">${member.role === 'captain' ? '⭐隊長' : '學員'}</div>
                <div class="text-lg font-black text-red-500">${latestWeight}</div>
            `;
            
            // 如果是目前使用者，加個框
            if (member.id === localStorage.getItem('my_user_id')) {
                card.classList.add('border-blue-500', 'bg-blue-50');
            }
        } else {
            // 湊不滿 9 人時顯示空格
            card.innerHTML = `<div class="text-gray-300 italic text-xs">待加入</div>`;
        }
        gridContainer.appendChild(card);
    }
}

// 網頁開啟時自動執行一次
window.onload = () => {
    if(typeof _client !== 'undefined') refreshGrid();
};
        
        // 1. 登記使用者功能
        async function registerUser() {
            const username = document.getElementById('username').value;
            const role = document.getElementById('role').value;
            const plan = document.getElementById('plan').value;

            if (!username) return alert("請輸入姓名");

            const { data, error } = await _client
                .from('profiles')
                .insert([{ username, role, plan_name: plan }])
                .select();

            if (error) {
                showMsg("登記失敗：" + error.message, true);
                console.error(error);
            } else {
                localStorage.setItem('my_user_id', data[0].id); 
                showMsg("✅ 登記成功！已記住你的 ID: " + data[0].id);
            }
        }

        // 2. 提交體重功能
        async function submitWeight() {
            const weight = document.getElementById('currentWeight').value;
            const userId = localStorage.getItem('my_user_id'); 

            if (!userId) return alert("請先完成上方登記");
            if (!weight) return alert("請輸入體重");

            const { error } = await _client
                .from('weight_logs')
                .insert([{ user_id: userId, weight: parseFloat(weight) }]);

            if (error) {
                showMsg("提交失敗：" + error.message, true);
                console.error(error);
            } else {
                showMsg("✅ 今日體重已更新！");
                document.getElementById('currentWeight').value = '';
            }
        }
    </script>
</body>
</html>
