<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馬拉松健身 - 體重記錄</title>
    <!-- 使用 Supabase v1 版本 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, system-ui, sans-serif;
        }
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 30px;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 登入/註冊頁面 */
        .auth-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #333;
            margin-bottom: 10px;
        }
        
        .auth-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .message-box {
            padding: 12px 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
        }
        
        .message-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .message-error {
            background: #fee;
            color: #dc2626;
            border: 1px solid #fbb;
        }
        
        .message-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        
        /* 主應用頁面 */
        .user-info {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            border: 2px solid white;
        }
        
        .user-details h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .user-details p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .record-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 2px solid #e5e7eb;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .date-display {
            background: #f3f4f6;
            color: #374151;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .weight-input-group {
            margin-bottom: 25px;
        }
        
        .weight-label {
            display: block;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 12px;
            text-align: center;
        }
        
        .weight-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .weight-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #e0e0e0;
            background: white;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .weight-btn:hover:not(:disabled) {
            background: #f3f4f6;
        }
        
        .weight-btn.primary {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        
        .weight-btn.primary:hover:not(:disabled) {
            background: #3b82f6;
            color: white;
        }
        
        .weight-display {
            width: 140px;
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            border: none;
            background: transparent;
            color: #3b82f6;
        }
        
        .weight-display:focus {
            outline: none;
        }
        
        .weight-range {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .auth-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .auth-link {
            background: none;
            border: none;
            color: #3b82f6;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
        }
        
        .auth-link:hover {
            text-decoration: underline;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #666;
            font-size: 14px;
        }
        
        .history-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        
        .history-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-date {
            color: #666;
            font-size: 14px;
        }
        
        .history-weight {
            color: #3b82f6;
            font-weight: 700;
            font-size: 16px;
        }
        
        .empty-history {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <!-- 登入頁面 -->
    <div id="auth-section" class="container">
        <h1 class="auth-title">🏃‍♂️ 馬拉松健身</h1>
        <p class="auth-subtitle">記錄您的體重，追蹤健身進度</p>
        
        <!-- 登入表單 -->
        <div id="login-form">
            <div class="form-group">
                <label class="form-label">電子郵件</label>
                <input type="email" id="login-email" class="form-input" placeholder="example@gmail.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">密碼</label>
                <input type="password" id="login-password" class="form-input" placeholder="至少6個字符">
            </div>
            
            <div id="login-message" class="message-box hidden"></div>
            
            <button id="login-btn" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i>
                <span>登入</span>
            </button>
            
            <div class="auth-links">
                <button id="show-signup" class="auth-link">註冊新帳號</button>
            </div>
        </div>
        
        <!-- 註冊表單 -->
        <div id="signup-form" class="hidden">
            <div class="form-group">
                <label class="form-label">電子郵件</label>
                <input type="email" id="signup-email" class="form-input" placeholder="example@gmail.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">密碼</label>
                <input type="password" id="signup-password" class="form-input" placeholder="至少6個字符" minlength="6">
            </div>
            
            <div class="form-group">
                <label class="form-label">確認密碼</label>
                <input type="password" id="signup-confirm" class="form-input" placeholder="再次輸入密碼">
            </div>
            
            <div class="form-group">
                <label class="form-label">您的暱稱</label>
                <input type="text" id="signup-name" class="form-input" placeholder="例如：小明">
            </div>
            
            <div id="signup-message" class="message-box hidden"></div>
            
            <button id="signup-btn" class="btn btn-primary">
                <i class="fas fa-user-plus"></i>
                <span>註冊</span>
            </button>
            
            <div class="auth-links">
                <button id="back-to-login" class="auth-link">返回登入</button>
            </div>
        </div>
        
        <div class="footer">
            <i class="fas fa-database"></i> 安全雲端儲存 • 隨時隨地存取
        </div>
    </div>

    <!-- 主應用頁面 -->
    <div id="app-section" class="container hidden">
        <!-- 使用者資訊 -->
        <div class="user-info">
            <div id="userAvatar" class="user-avatar">U</div>
            <div class="user-details">
                <h3 id="userName">使用者</h3>
                <p id="userEmail">user@example.com</p>
            </div>
        </div>
        
        <!-- 體重記錄卡片 -->
        <div class="record-card">
            <div class="card-title">
                <i class="fas fa-weight-scale" style="color: #3b82f6;"></i>
                今日體重記錄
            </div>
            
            <div id="dateDisplay" class="date-display">載入日期...</div>
            
            <div class="weight-input-group">
                <label class="weight-label">體重 (公斤)</label>
                <div class="weight-container">
                    <button id="weight-minus" class="weight-btn">-</button>
                    <input type="number" id="weight-input" class="weight-display" value="65.0" step="0.1" min="30" max="200">
                    <button id="weight-plus" class="weight-btn primary">+</button>
                </div>
                <div class="weight-range">範圍: 30-200 公斤</div>
            </div>
            
            <div id="record-message" class="message-box hidden"></div>
            
            <button id="save-btn" class="btn btn-success">
                <i class="fas fa-save"></i>
                <span>儲存今日體重</span>
            </button>
            
            <!-- 歷史記錄 -->
            <div class="history-card">
                <div class="history-title">
                    <i class="fas fa-history"></i>
                    最近記錄
                </div>
                <div id="history-list" class="history-list">
                    <div class="empty-history">尚未有記錄</div>
                </div>
            </div>
            
            <!-- 登出按鈕 -->
            <div style="margin-top: 20px;">
                <button id="logout-btn" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>登出</span>
                </button>
            </div>
        </div>
        
        <div class="footer">
            © 2024 馬拉松健身 • 堅持就是勝利
        </div>
    </div>

    <script>
        // Supabase 配置 - 使用 v1 API
        const SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        
        // 初始化 Supabase 客戶端
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;
        
        // 頁面載入時初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('馬拉松健身應用啟動...');
            
            // 設定事件監聽器
            setupEventListeners();
            
            // 檢查登入狀態
            checkAuthStatus();
            
            // 更新日期顯示
            updateDateDisplay();
        });
        
        // 設定事件監聽器
        function setupEventListeners() {
            // 登入相關
            document.getElementById('login-btn').addEventListener('click', handleLogin);
            document.getElementById('show-signup').addEventListener('click', showSignupForm);
            document.getElementById('back-to-login').addEventListener('click', showLoginForm);
            document.getElementById('signup-btn').addEventListener('click', handleSignup);
            
            // 體重輸入相關
            document.getElementById('weight-minus').addEventListener('click', () => adjustWeight(-0.1));
            document.getElementById('weight-plus').addEventListener('click', () => adjustWeight(0.1));
            document.getElementById('weight-input').addEventListener('change', validateWeight);
            
            // 主應用相關
            document.getElementById('save-btn').addEventListener('click', saveWeight);
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            
            // 按 Enter 鍵登入
            document.getElementById('login-password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            
            // 按 Enter 鍵註冊
            document.getElementById('signup-confirm').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSignup();
            });
        }
        
        // 檢查認證狀態 - 簡化版本
        function checkAuthStatus() {
            try {
                console.log('檢查登入狀態...');
                
                // 直接檢查當前 session
                const session = supabaseClient.auth.session();
                
                if (session && session.user) {
                    // 已登入
                    console.log('使用者已登入:', session.user.email);
                    currentUser = session.user;
                    loadUserData();
                    showAppSection();
                } else {
                    // 未登入
                    console.log('使用者未登入');
                    showAuthSection();
                }
            } catch (error) {
                console.error('檢查認證狀態錯誤:', error);
                showAuthSection();
            }
        }
        
        // 顯示登入頁面
        function showAuthSection() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            clearAuthForms();
        }
        
        // 顯示主應用頁面
        function showAppSection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
        }
        
        // 顯示登入表單
        function showLoginForm() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('signup-form').classList.add('hidden');
            clearAuthMessages();
        }
        
        // 顯示註冊表單
        function showSignupForm() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
            clearAuthMessages();
        }
        
        // 清除認證表單
        function clearAuthForms() {
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('signup-email').value = '';
            document.getElementById('signup-password').value = '';
            document.getElementById('signup-confirm').value = '';
            document.getElementById('signup-name').value = '';
            clearAuthMessages();
        }
        
        // 清除認證訊息
        function clearAuthMessages() {
            hideMessage('login-message');
            hideMessage('signup-message');
        }
        
        // 處理登入
        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            
            // 驗證輸入
            if (!email || !password) {
                showAuthMessage('請填寫電子郵件和密碼', 'error');
                return;
            }
            
            // 顯示載入狀態
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div>';
            btn.disabled = true;
            
            try {
                console.log('登入中...');
                const { user, error } = await supabaseClient.auth.signIn({
                    email,
                    password
                });
                
                if (error) throw error;
                
                console.log('登入成功:', user.email);
                currentUser = user;
                
                // 載入使用者資料
                await loadUserData();
                showAppSection();
                
            } catch (error) {
                console.error('登入錯誤:', error);
                let message = '登入失敗';
                
                if (error.message.includes('Invalid login credentials')) {
                    message = '電子郵件或密碼錯誤';
                } else if (error.message.includes('Email not confirmed')) {
                    message = '請先驗證您的電子郵件';
                }
                
                showAuthMessage(message, 'error');
            } finally {
                // 恢復按鈕狀態
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // 處理註冊
        async function handleSignup() {
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm').value;
            const fullName = document.getElementById('signup-name').value.trim();
            const btn = document.getElementById('signup-btn');
            
            // 驗證輸入
            if (!email || !password || !confirmPassword || !fullName) {
                showAuthMessage('請填寫所有欄位', 'error', 'signup-message');
                return;
            }
            
            if (password.length < 6) {
                showAuthMessage('密碼至少需要6個字符', 'error', 'signup-message');
                return;
            }
            
            if (password !== confirmPassword) {
                showAuthMessage('兩次輸入的密碼不一致', 'error', 'signup-message');
                return;
            }
            
            // 顯示載入狀態
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div>';
            btn.disabled = true;
            
            try {
                console.log('註冊中...');
                
                // 註冊使用者
                const { user, error } = await supabaseClient.auth.signUp({
                    email,
                    password
                });
                
                if (error) throw error;
                
                console.log('註冊成功:', user);
                
                if (user) {
                    // 直接顯示主應用頁面，不等待 profiles 表創建
                    currentUser = user;
                    
                    // 建立使用者資料（在後台執行，不等待）
                    supabaseClient
                        .from('profiles')
                        .insert([{
                            id: user.id,
                            email: user.email,
                            full_name: fullName
                        }])
                        .then(() => {
                            console.log('使用者資料建立成功');
                        })
                        .catch(err => {
                            console.error('建立使用者資料錯誤（非關鍵）:', err);
                        });
                    
                    // 更新使用者介面
                    updateUserUI({
                        full_name: fullName,
                        email: user.email
                    });
                    
                    showAppSection();
                }
                
            } catch (error) {
                console.error('註冊錯誤:', error);
                let message = '註冊失敗';
                
                if (error.message.includes('User already registered')) {
                    message = '此電子郵件已註冊';
                } else if (error.message.includes('Invalid email')) {
                    message = '請輸入有效的電子郵件地址';
                } else if (error.message.includes('already been taken')) {
                    message = '此電子郵件已被使用';
                }
                
                showAuthMessage(message, 'error', 'signup-message');
            } finally {
                // 恢復按鈕狀態
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // 載入使用者資料
        async function loadUserData() {
            if (!currentUser) return;
            
            // 更新使用者介面（基本資料）
            updateUserUI({
                full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
                email: currentUser.email
            });
            
            try {
                // 嘗試載入使用者資料
                const { data: profile, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (!error && profile) {
                    // 如果有資料，更新使用者介面
                    updateUserUI(profile);
                } else {
                    // 如果沒有資料，建立一個
                    await createUserProfile();
                }
                
                // 檢查今日記錄
                await checkTodayRecord();
                
                // 載入歷史記錄
                await loadHistory();
                
            } catch (error) {
                console.error('載入使用者資料失敗（非關鍵）:', error);
                // 即使失敗，仍然繼續
                await checkTodayRecord();
                await loadHistory();
            }
        }
        
        // 建立使用者資料
        async function createUserProfile() {
            try {
                const { error } = await supabaseClient
                    .from('profiles')
                    .insert([{
                        id: currentUser.id,
                        email: currentUser.email,
                        full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0]
                    }]);
                
                if (error) {
                    // 如果已經存在，忽略錯誤
                    if (!error.message.includes('duplicate key')) {
                        throw error;
                    }
                } else {
                    console.log('使用者資料建立成功');
                }
                
            } catch (error) {
                console.error('建立使用者資料錯誤（非關鍵）:', error);
            }
        }
        
        // 更新使用者介面
        function updateUserUI(profile) {
            // 更新使用者名稱
            const displayName = profile.full_name || currentUser.email.split('@')[0];
            document.getElementById('userName').textContent = displayName;
            document.getElementById('userEmail').textContent = currentUser.email;
            
            // 更新頭像
            const avatarElement = document.getElementById('userAvatar');
            const initials = displayName.charAt(0).toUpperCase();
            avatarElement.textContent = initials;
        }
        
        // 檢查今日記錄
        async function checkTodayRecord() {
            if (!currentUser) return;
            
            try {
                const today = new Date().toISOString().split('T')[0];
                
                const { data, error } = await supabaseClient
                    .from('weight_records')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('date', today)
                    .single();
                
                if (error && error.code !== 'PGRST116') {
                    // 忽略特定錯誤代碼
                    if (error.code !== '42P01') { // 表不存在
                        console.error('檢查今日記錄錯誤:', error);
                    }
                    return;
                }
                
                if (data) {
                    // 有今日記錄，填入體重
                    document.getElementById('weight-input').value = data.weight || 65.0;
                    showRecordMessage('已載入今日記錄，可修改後重新儲存', 'info');
                }
                
            } catch (error) {
                console.error('檢查今日記錄失敗（非關鍵）:', error);
            }
        }
        
        // 載入歷史記錄
        async function loadHistory() {
            if (!currentUser) return;
            
            try {
                const { data, error } = await supabaseClient
                    .from('weight_records')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('date', { ascending: false })
                    .limit(7);
                
                if (error) {
                    // 忽略特定錯誤
                    if (error.code !== '42P01') { // 表不存在
                        console.error('載入歷史記錄錯誤:', error);
                    }
                    return;
                }
                
                updateHistoryList(data || []);
                
            } catch (error) {
                console.error('載入歷史記錄失敗（非關鍵）:', error);
            }
        }
        
        // 更新歷史記錄列表
        function updateHistoryList(records) {
            const historyList = document.getElementById('history-list');
            
            if (!records || records.length === 0) {
                historyList.innerHTML = '<div class="empty-history">尚未有記錄</div>';
                return;
            }
            
            let html = '';
            records.forEach(record => {
                const date = new Date(record.date);
                const dateStr = date.toLocaleDateString('zh-TW', {
                    month: 'short',
                    day: 'numeric'
                });
                
                html += `
                    <div class="history-item">
                        <div class="history-date">${dateStr}</div>
                        <div class="history-weight">${record.weight} kg</div>
                    </div>
                `;
            });
            
            historyList.innerHTML = html;
        }
        
        // 調整體重
        function adjustWeight(change) {
            const input = document.getElementById('weight-input');
            let currentValue = parseFloat(input.value) || 0;
            let newValue = currentValue + change;
            
            // 設定範圍限制
            newValue = Math.max(30, Math.min(200, newValue));
            
            // 更新數值，保留一位小數
            input.value = newValue.toFixed(1);
        }
        
        // 驗證體重
        function validateWeight() {
            const input = document.getElementById('weight-input');
            let value = parseFloat(input.value) || 0;
            
            // 設定範圍限制
            value = Math.max(30, Math.min(200, value));
            
            // 更新數值，保留一位小數
            input.value = value.toFixed(1);
        }
        
        // 儲存體重 - 簡化版本
        async function saveWeight() {
            if (!currentUser) {
                showRecordMessage('請先登入', 'error');
                return;
            }
            
            const weight = parseFloat(document.getElementById('weight-input').value);
            const btn = document.getElementById('save-btn');
            
            // 驗證輸入
            if (isNaN(weight) || weight < 30 || weight > 200) {
                showRecordMessage('請輸入有效的體重 (30-200公斤)', 'error');
                return;
            }
            
            // 顯示載入狀態
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div> 儲存中...';
            btn.disabled = true;
            
            try {
                const today = new Date().toISOString().split('T')[0];
                
                // 使用 upsert 方法，自動處理更新或插入
                const { error } = await supabaseClient
                    .from('weight_records')
                    .upsert({
                        user_id: currentUser.id,
                        weight: weight,
                        date: today,
                        updated_at: new Date().toISOString()
                    }, {
                        onConflict: 'user_id,date'
                    });
                
                if (error) throw error;
                
                // 顯示成功訊息
                showRecordMessage('✅ 體重記錄儲存成功！', 'success');
                
                // 重新載入歷史記錄
                await loadHistory();
                
            } catch (error) {
                console.error('儲存體重錯誤:', error);
                showRecordMessage('❌ 儲存失敗: ' + (error.message || '請稍後再試'), 'error');
            } finally {
                // 恢復按鈕狀態
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // 處理登出
        async function handleLogout() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                
                // 顯示登入頁面
                showAuthSection();
                showLoginForm();
                
            } catch (error) {
                console.error('登出錯誤:', error);
                showRecordMessage('登出失敗: ' + error.message, 'error');
            }
        }
        
        // 顯示認證訊息
        function showAuthMessage(text, type, elementId = 'login-message') {
            const element = document.getElementById(elementId);
            element.textContent = text;
            element.className = 'message-box';
            
            if (type === 'success') {
                element.classList.add('message-success');
            } else if (type === 'error') {
                element.classList.add('message-error');
            } else if (type === 'info') {
                element.classList.add('message-info');
            }
            
            element.classList.remove('hidden');
            
            // 自動隱藏訊息
            setTimeout(() => {
                element.classList.add('hidden');
            }, 3000);
        }
        
        // 顯示記錄訊息
        function showRecordMessage(text, type) {
            const element = document.getElementById('record-message');
            element.textContent = text;
            element.className = 'message-box';
            
            if (type === 'success') {
                element.classList.add('message-success');
            } else if (type === 'error') {
                element.classList.add('message-error');
            } else if (type === 'info') {
                element.classList.add('message-info');
            }
            
            element.classList.remove('hidden');
            
            // 3秒後自動隱藏
            setTimeout(() => {
                element.classList.add('hidden');
            }, 3000);
        }
        
        // 隱藏訊息
        function hideMessage(elementId) {
            const element = document.getElementById(elementId);
            element.classList.add('hidden');
        }
        
        // 更新日期顯示
        function updateDateDisplay() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                weekday: 'long' 
            };
            const dateString = now.toLocaleDateString('zh-TW', options);
            document.getElementById('dateDisplay').textContent = dateString;
        }
    </script>
</body>
</html>
