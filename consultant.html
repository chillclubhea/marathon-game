<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能健康顧問 - 專業對話版</title> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f3f4f6; }
        .chat-container { height: 300px; overflow-y: auto; scroll-behavior: smooth; }
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="pb-10">

    <div class="bg-gradient-to-r from-green-600 to-green-500 p-6 text-white rounded-b-[2rem] shadow-lg">
        <div class="flex items-center space-x-4">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Coach" class="w-16 h-16 bg-white rounded-full border-2 border-green-200">
            <div>
                <h1 class="text-xl font-bold">AI 康寶萊健康管理師</h1>
                <p class="text-xs text-green-100">80% 營養 + 20% 運動 • 24小時在線</p>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-6">
        <div class="glass-morphism rounded-3xl p-4 shadow-xl mb-6 border border-white">
            <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center">
                <span class="mr-2">💬</span> 快速諮詢 AI 教練
            </h3>
            
            <div id="chatHistory" class="chat-container space-y-3 mb-4 p-2 text-xs border-b border-gray-100">
                <div class="flex justify-start">
                    <div class="bg-gray-100 p-3 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm text-gray-700">
                        您好！我是您的專屬管理師。今天報數後感覺如何？關於奶昔搭配、草本茶飲用或午餐選擇，都可以問我喔！
                    </div>
                </div>
            </div>

            <div class="flex space-x-2">
                <input id="userInput" type="text" 
                    class="flex-1 border-none bg-gray-100 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-green-500 outline-none" 
                    placeholder="例如：午餐怎麼吃？">
                <button onclick="askOpenAI()" id="sendBtn" 
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-2xl transition-all shadow-md active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="expertPanel" class="bg-white rounded-3xl p-5 shadow-md border border-gray-50">
            <h4 class="font-bold text-gray-800 text-sm mb-4">🌱 基於今日數據的處方</h4>
            <div id="dataList" class="grid grid-cols-2 gap-3 mb-4">
                </div>
            <div id="productAdvice" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        // --- 設定區 ---
        const OPENAI_API_KEY = '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'; 
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        // --- AI 對話邏輯 ---
        async function askOpenAI() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const history = document.getElementById('chatHistory');
            const question = input.value.trim();
            
            if (!question) return;

            // 1. 顯示使用者訊息
            appendMessage('user', question);
            input.value = '';
            btn.disabled = true;

            // 2. 呼叫 OpenAI API
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [
                            {
                                role: "system",
                                content: "你是一位擁有10年經驗的康寶萊(Herbalife)健康管理師。語氣專業且溫暖。強調「80%營養+20%運動」與「細胞營養學」。當用戶問飲食建議時，優先推薦三杯水方案(蘆薈汁、草本茶、奶昔)與蛋白質補充(PPP)。"
                            },
                            { role: "user", content: question }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                const aiReply = data.choices[0].message.content;
                appendMessage('ai', aiReply);
            } catch (err) {
                appendMessage('ai', "抱歉，教練現在訊號不太好，請稍後再試。");
            } finally {
                btn.disabled = false;
            }
        }

        function appendMessage(role, text) {
            const history = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const contentClass = role === 'user' 
                ? 'bg-green-500 text-white rounded-2xl rounded-tr-none' 
                : 'bg-gray-100 text-gray-700 rounded-2xl rounded-tl-none';

            div.innerHTML = `<div class="${contentClass} p-3 max-w-[85%] shadow-sm leading-relaxed">${text}</div>`;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        // --- 初始化頁面數據 ---
        window.onload = async () => {
            const userId = localStorage.getItem('my_user_id');
            const { data: profile } = await _client.from('profiles').select('*').eq('id', userId).single();
            const { data: log } = await _client.from('weight_logs').select('weight').eq('user_id', userId).order('created_at', { ascending: false }).limit(1).single();

            if (profile && log) {
                const bmr = Math.round(10 * log.weight + 6.25 * profile.height - 5 * 25 + (profile.gender === 'male' ? 5 : -161));
                const water = Math.round(log.weight * 45);

                document.getElementById('dataList').innerHTML = `
                    <div class="bg-blue-50 p-3 rounded-xl"><p class="text-[10px] text-blue-500">BMR 代謝</p><p class="font-bold">${bmr} kcal</p></div>
                    <div class="bg-blue-50 p-3 rounded-xl"><p class="text-[10px] text-blue-500">建議飲水</p><p class="font-bold">${water} ml</p></div>
                `;

                document.getElementById('productAdvice').innerHTML = `
                    <div class="text-xs p-3 border-l-2 border-green-500 bg-green-50 rounded-r-xl">
                        <strong>🌟 管理師處方：</strong><br>
                        今日建議：2 匙 F1 奶昔 + ${log.weight > 65 ? '2' : '1'} 匙 PPP 蛋白質。別忘了早起先喝蘆薈汁清理腸道喔！
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
