<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能健康顧問 - 專業對話版</title> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { background-color: #f3f4f6; font-family: 'Noto Sans TC', sans-serif; }
        .chat-container { height: 400px; overflow-y: auto; scroll-behavior: smooth; }
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .typing-dot { animation: typing 1.4s infinite; }
        @keyframes typing { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
</head>
<body class="pb-10">

    <div class="bg-gradient-to-r from-green-600 to-green-500 p-6 text-white rounded-b-[2.5rem] shadow-lg">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Coach" class="w-16 h-16 bg-white rounded-full border-2 border-green-200">
                <div>
                    <h1 class="text-xl font-bold">AI 康寶萊健康管理師</h1>
                    <p class="text-xs text-green-100 flex items-center">
                        <span class="w-2 h-2 bg-green-300 rounded-full mr-2 animate-pulse"></span>
                        專業康復背景 • 24小時在線
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-6">
        <div class="glass-morphism rounded-3xl p-4 shadow-xl mb-6 border border-white">
            <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center px-2">
                <span class="mr-2">💬</span> 智能諮詢對話
            </h3>
            
            <div id="chatHistory" class="chat-container space-y-4 mb-4 p-2 text-sm">
                <div class="flex justify-start">
                    <div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm text-gray-700 leading-relaxed">
                        您好！我是您的專屬健康管理師。作為一名運動康復師，我知道您對體態有極高要求。今天打算如何優化您的「三杯水」計畫呢？
                    </div>
                </div>
            </div>

            <div class="flex space-x-2 bg-gray-50 p-2 rounded-2xl border border-gray-100">
                <input id="userInput" type="text" 
                    class="flex-1 border-none bg-transparent px-3 py-2 text-sm focus:outline-none" 
                    placeholder="詢問午餐建議或產品搭配..."
                    onkeypress="if(event.keyCode===13) askOpenAI()">
                <button onclick="askOpenAI()" id="sendBtn" 
                    class="bg-green-600 hover:bg-green-700 text-white p-3 rounded-xl transition-all shadow-md active:scale-95 disabled:bg-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="expertPanel" class="bg-white rounded-3xl p-5 shadow-md border border-gray-50">
            <div class="flex justify-between items-center mb-4">
                <h4 class="font-bold text-gray-800 text-sm">🌱 今日個人化方案</h4>
                <span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full">數據已同步</span>
            </div>
            <div id="dataList" class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-blue-50 p-3 rounded-xl animate-pulse">計算中...</div>
                <div class="bg-blue-50 p-3 rounded-xl animate-pulse">計算中...</div>
            </div>
            <div id="productAdvice" class="space-y-3 text-xs">
                </div>
        </div>
    </div>

    <script>
        // --- 設定區 ---
        // 請確保你的 Key 有餘額且在 platform.openai.com 設定了正確的權限
        const OPENAI_API_KEY = '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'; 
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        
        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        // --- AI 對話邏輯 ---
        async function askOpenAI() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const question = input.value.trim();
            if (!question) return;

            // 1. 顯示使用者訊息
            appendMessage('user', question);
            input.value = '';
            btn.disabled = true;

            // 2. 顯示等待狀態
            const loadingId = 'loading-' + Date.now();
            appendLoadingMessage(loadingId);

            // 3. 獲取當前頁面數據作為上下文
            const bmrData = document.getElementById('dataList').innerText.replace(/\n/g, ' ');
            const systemContent = `你是一位專業康寶萊健康管理師。
            用戶背景：26歲男性，運動康復師。目標：減重10kg，體脂降至12%。
            當前數據：${bmrData}。
            守則：
            1. 強調「80%營養+20%運動」。
            2. 推薦三杯水：蘆薈汁(清)、草本茶(調)、奶昔(補)。
            3. 因為用戶是康復師，建議中可以提到肌肉修復與蛋白質(PPP)的重要性。
            4. 語氣要專業、積極、充滿鼓勵。`;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo", // 如果有權限建議用 gpt-4
                        messages: [
                            { role: "system", content: systemContent },
                            { role: "user", content: question }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // 錯誤處理：針對 401 或其他錯誤
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.choices[0].message.content;
                removeLoadingMessage(loadingId);
                appendMessage('ai', aiReply);

            } catch (err) {
                removeLoadingMessage(loadingId);
                console.error(err);
                appendMessage('ai', `❌ 錯誤：${err.message.includes('401') ? 'API金鑰驗證失敗或無權限' : '連線異常'}，請檢查控制台。`);
            } finally {
                btn.disabled = false;
            }
        }

        // --- UI 輔助函數 ---
        function appendMessage(role, text) {
            const history = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const contentClass = role === 'user' 
                ? 'bg-green-500 text-white rounded-2xl rounded-tr-none' 
                : 'bg-white text-gray-700 rounded-2xl rounded-tl-none border border-gray-100 shadow-sm';

            div.innerHTML = `<div class="${contentClass} p-4 max-w-[88%] leading-relaxed whitespace-pre-wrap">${text}</div>`;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function appendLoadingMessage(id) {
            const history = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex justify-start';
            div.innerHTML = `
                <div class="bg-gray-100 p-3 rounded-2xl rounded-tl-none flex space-x-1">
                    <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot" style="animation-delay: 0.2s"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot" style="animation-delay: 0.4s"></div>
                </div>`;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function removeLoadingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // --- 初始化頁面數據 (從 Supabase 獲取) ---
        window.onload = async () => {
            // 這裡模擬從 Supabase 獲取你的數據，建議將 userId 存入 localStorage
            const userId = localStorage.getItem('my_user_id') || 'test-user'; 
            
            // 預設展示數據 (以便在 Supabase 未連接時也能看到效果)
            let weight = 75, height = 177, gender = 'male';

            try {
                const { data: profile } = await _client.from('profiles').select('*').eq('id', userId).single();
                const { data: log } = await _client.from('weight_logs').select('weight').eq('user_id', userId).order('created_at', { ascending: false }).limit(1).single();
                if (profile) { height = profile.height; gender = profile.gender; }
                if (log) { weight = log.weight; }
            } catch (e) {
                console.log("使用預設數據展示");
            }

            const bmr = Math.round(10 * weight + 6.25 * height - 5 * 26 + (gender === 'male' ? 5 : -161));
            const water = Math.round(weight * 45);

            document.getElementById('dataList').innerHTML = `
                <div class="bg-blue-50 p-3 rounded-2xl border border-blue-100 text-center">
                    <p class="text-[10px] text-blue-500 font-bold uppercase tracking-wider">BMR 代謝</p>
                    <p class="text-lg font-black text-blue-700">${bmr}<span class="text-xs ml-1">kcal</span></p>
                </div>
                <div class="bg-green-50 p-3 rounded-2xl border border-green-100 text-center">
                    <p class="text-[10px] text-green-500 font-bold uppercase tracking-wider">建議飲水</p>
                    <p class="text-lg font-black text-green-700">${water}<span class="text-xs ml-1">ml</span></p>
                </div>
            `;

            document.getElementById('productAdvice').innerHTML = `
                <div class="p-4 border-l-4 border-green-500 bg-green-50 rounded-r-2xl">
                    <p class="font-bold text-green-800 mb-1">🎯 康復師增肌減脂配方：</p>
                    <p class="leading-loose text-green-700">
                        • 早餐：F1 奶昔 2 匙 + PPP 2 匙<br>
                        • 代謝：草本茶 2000ml (取代午餐含糖飲料)<br>
                        • 修復：晚餐建議優質蛋白，若外食燒烤請加配大蒜片。
                    </p>
                </div>
            `;
        };
    </script>
</body>
</html>
