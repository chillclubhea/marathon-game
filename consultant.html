<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能健康管理師 - 專屬方案</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f9fafb; -webkit-tap-highlight-color: transparent; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .gradient-bg { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
    </style>
</head>
<body class="pb-10">

    <div class="gradient-bg p-6 text-white rounded-b-[2.5rem] card-shadow">
        <div class="flex justify-between items-start mb-4">
            <a href="report.html" class="text-white/80 text-sm">← 返回報數</a>
            <span class="bg-white/20 px-3 py-1 rounded-full text-[10px] backdrop-blur-md">80% 營養 + 20% 運動</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="relative">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=HealthCoach" class="w-20 h-20 bg-white rounded-full border-2 border-white/50">
                <div class="absolute bottom-0 right-0 w-5 h-5 bg-green-400 border-2 border-white rounded-full"></div>
            </div>
            <div>
                <h1 class="text-2xl font-black">AI 智能管理師</h1>
                <p class="text-green-100 text-xs mt-1">10 年康寶萊細胞營養經驗</p>
                <div class="flex space-x-2 mt-2">
                    <span class="text-[10px] bg-green-700/30 px-2 py-0.5 rounded">專業專業</span>
                    <span class="text-[10px] bg-green-700/30 px-2 py-0.5 rounded">溫暖鼓勵</span>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-8">
        <div class="bg-white rounded-3xl p-6 shadow-xl grid grid-cols-2 gap-4 mb-6">
            <div class="text-center border-r border-gray-100">
                <p class="text-gray-400 text-xs mb-1">基礎代謝 (BMR)</p>
                <p id="bmrValue" class="text-xl font-black text-green-600">--</p>
                <p class="text-[9px] text-gray-400">kcal / 日</p>
            </div>
            <div class="text-center">
                <p class="text-gray-400 text-xs mb-1">每日水目標</p>
                <p id="waterGoal" class="text-xl font-black text-blue-500">--</p>
                <p class="text-[9px] text-gray-400">ml (含茶水)</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-5 mb-6 border-l-4 border-green-500 shadow-sm">
            <h3 class="text-sm font-bold text-gray-800 mb-2 flex items-center">
                <span class="mr-2">💬</span> 管理師今日分析
            </h3>
            <p id="coachAnalysis" class="text-gray-600 text-xs leading-relaxed italic">
                正在分析您的身體數據，請稍候...
            </p>
        </div>

        <h2 class="font-black text-gray-800 mb-4 px-2">🌱 核心細胞營養方案</h2>
        <div id="productPlan" class="space-y-4 mb-8">
            </div>

        <div class="bg-blue-50 rounded-2xl p-5 mb-8 border border-blue-100">
            <h3 class="text-blue-800 font-bold text-sm mb-3 flex items-center">
                <span class="mr-2">🍱</span> 建議飲食結構
            </h3>
            <div class="space-y-3">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-blue-700">早餐 (補)</span>
                    <span class="font-bold text-blue-900">F1 奶昔 + PPP 蛋白質</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-blue-700">午餐 (正餐)</span>
                    <span class="font-bold text-blue-900">原型食物 (1:1:2 比例)</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-blue-700">晚餐 (補)</span>
                    <span class="font-bold text-blue-900">F1 奶昔 (+ 蛋白質)</span>
                </div>
            </div>
        </div>

        <p class="text-[10px] text-gray-400 text-center px-6">
            本方案基於康寶萊細胞營養理念設計。產品非藥物，不具療效宣稱。減重效果因人而異，需配合健康飲食與適度運動。
        </p>
    </div>

    <script>
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        window.onload = async () => {
            const userId = localStorage.getItem('my_user_id');
            if (!userId) { window.location.href = "index.html"; return; }

            // 1. 抓取用戶資料與最新體重
            const { data: profile } = await _client.from('profiles').select('*').eq('id', userId).single();
            const { data: logs } = await _client.from('weight_logs').select('weight').eq('user_id', userId).order('created_at', { ascending: false }).limit(1);
            
            if (profile && logs?.[0]) {
                renderConsultant(profile, logs[0].weight);
            }
        };

        function renderConsultant(profile, currentWeight) {
            // 計算數據
            const heightM = profile.height / 100;
            const bmi = (currentWeight / (heightM * heightM)).toFixed(1);
            const bmr = Math.round(10 * currentWeight + 6.25 * profile.height - 5 * 25 + (profile.gender === 'male' ? 5 : -161));
            const waterGoal = Math.round(currentWeight * 45);
            const proteinGoal = Math.round(currentWeight * 1.5);

            document.getElementById('bmrValue').innerText = bmr;
            document.getElementById('waterGoal').innerText = waterGoal;

            // 分析語句
            let analysis = "";
            if (bmi > 24) {
                analysis = `親愛的 ${profile.username}，目前 BMI 為 ${bmi} 屬於優化空間較大的階段。我們首要任務是「清理腸道」與「建立熱量赤字」。康寶萊的細胞營養會幫你補足缺口，不挨餓也能瘦！`;
            } else {
                analysis = `嗨 ${profile.username}！目前身材維持得不錯。現在我們可以進入「體態雕塑期」，重點放在增加蛋白質攝取（PPP），讓線條更緊實。`;
            }
            document.getElementById('coachAnalysis').innerText = analysis;

            // 核心三杯水計畫
            const plan = [
                { 
                    icon: "💧", 
                    name: "第一杯：大蒜片 / 濃縮蘆薈汁 (清)", 
                    time: "起床空腹", 
                    desc: "幫腸道做 SPA，優化絨毛吸收力，這是細胞營養的第一步。",
                    color: "text-green-600"
                },
                { 
                    icon: "🥤", 
                    name: "第二杯：F1 奶昔 + PPP 蛋白質 (補)", 
                    time: "早餐 & 晚餐", 
                    desc: `建議：2 匙奶昔 + ${currentWeight > 70 ? '2' : '1'} 匙蛋白質粉。確保攝取達到 ${proteinGoal}g 蛋白質。`,
                    color: "text-orange-500"
                },
                { 
                    icon: "🍵", 
                    name: "第三杯：草本茶 (調)", 
                    time: "全天分次", 
                    desc: `您的「脂肪搬運工」。請將茶粉加入 ${waterGoal}ml 水中，幫助代謝體脂。`,
                    color: "text-blue-600"
                }
            ];

            const planContainer = document.getElementById('productPlan');
            planContainer.innerHTML = plan.map(item => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-50 flex items-start space-x-4">
                    <div class="text-3xl">${item.icon}</div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                        </div>
                        <p class="text-[10px] font-bold ${item.color} mt-0.5">${item.time}</p>
                        <p class="text-gray-500 text-[11px] mt-2 leading-relaxed">${item.desc}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
