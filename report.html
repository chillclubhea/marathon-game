    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'PingFang TC', sans-serif; }
        input { user-select: auto; }
        .modal-overlay { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); transition: all 0.3s ease; }
        .modal-content { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-hidden { opacity: 0; pointer-events: none; }
        .modal-hidden .modal-content { transform: scale(0.8) translateY(30px); }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-5deg); }
            50% { transform: translateX(2px) rotate(5deg); }
            100% { transform: translateX(0); }
        }
        .bell-active { animation: shake 0.3s ease-in-out; background-color: #fef3c7 !important; color: #d97706 !important; }

        @keyframes breath {
            0% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
            50% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
            100% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
        }
        .status-pulse { animation: breath 2s infinite; }

        @keyframes highlight {
            0% { background-color: rgba(59, 130, 246, 0.1); }
            100% { background-color: transparent; }
        }
        .highlight-update { animation: highlight 2s ease-in-out; }
    </style>
</head>

        // ==================== 工具函數 ====================
        function formatDate(date) {
            return `${date.getMonth() + 1}月${date.getDate()}日`;
        }

        function getChallengeInfo() {
            if (appState.challengeInfo) {
                return appState.challengeInfo;
            }

            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();

            let result = {
                isOffPeriod: true,
                currentDate: today,
                dayInSession: 0,
                sessionNumber: 0,
                sessionStart: null,
                sessionEnd: null,
                nextSessionStart: null,
                isRestDay: false,
                isLastDay: false,
                message: "間隔期，無挑戰"
            };

            if (day >= 1 && day <= 10) {
                result.sessionStart = new Date(year, month - 1, 1);
                result.dayInSession = day;
                const baseYear = 2026;
                const baseMonth = 1;
                const monthsSinceBase = (year - baseYear) * 12 + (month - baseMonth);
                result.sessionNumber = monthsSinceBase * 2;
                result.isOffPeriod = false;
            } else if (day >= 16 && day <= 25) {
                result.sessionStart = new Date(year, month - 1, 16);
                result.dayInSession = day - 15;
                const baseYear = 2026;
                const baseMonth = 1;
                const monthsSinceBase = (year - baseYear) * 12 + (month - baseMonth);
                result.sessionNumber = monthsSinceBase * 2 + 1;
                result.isOffPeriod = false;
            }

            if (!result.isOffPeriod) {
                result.sessionEnd = new Date(result.sessionStart);
                result.sessionEnd.setDate(result.sessionStart.getDate() + 9);
                if (result.sessionStart.getDate() === 1) {
                    result.nextSessionStart = new Date(year, month - 1, 16);
                } else {
                    result.nextSessionStart = new Date(month === 12 ? year + 1 : year, month === 12 ? 0 : month, 1);
                }
                result.isRestDay = result.dayInSession === 7;
                result.isLastDay = result.dayInSession === 10;
                result.message = null;
            }

            appState.challengeInfo = result;
            return result;
        }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastUpdateTime').textContent = timeStr;

        // ==================== 日期與倒數計時 ====================
        function updateDayDisplay() {
            const ci = getChallengeInfo();
            document.getElementById('currentDay').textContent = ci.isOffPeriod ? '--' : ci.dayInSession;
            document.getElementById('totalDays').textContent = `/ ${CHALLENGE_DURATION} 天`;

            const badgeElement = document.getElementById('dayStatusBadge');
            const messageElement = document.getElementById('dayMessage');
            const weightInput = document.getElementById('currentWeight');
            const submitBtn = document.getElementById('btnSubmit');

            if (ci.isOffPeriod) {
                badgeElement.textContent = "間隔期";
                badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-gray-100 text-gray-800";

                weightInput.disabled = true;
                submitBtn.disabled = true;
                submitBtn.textContent = "間隔期";
            } else {
                weightInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = "送出數據並看知識";

                if (ci.isRestDay) {
                    badgeElement.textContent = "休息日";
                    badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-yellow-100 text-yellow-800";
                    messageElement.innerHTML = `<div class="flex items-center gap-2"><span class="text-yellow-500">🏖️</span><span>今天是休息日，可以放鬆一下，也可以繼續記錄體重！</span></div>`;
                } else if (ci.isLastDay) {
                    badgeElement.textContent = "最後一天";

                }
            }

            document.getElementById('sessionBadge').textContent = ci.isOffPeriod ? "間隔期" : `第 ${ci.sessionNumber} 期`;
            document.getElementById('sessionStartDate').textContent = ci.sessionStart ? formatDate(ci.sessionStart) : "--";
            document.getElementById('sessionEndDate').textContent = ci.sessionEnd ? formatDate(ci.sessionEnd) : "--";
            document.getElementById('nextSessionStart').textContent = ci.nextSessionStart ? formatDate(ci.nextSessionStart) : "--";
        }

        function updateCountdown() {
            const now = new Date();
            const deadline = new Date();
            deadline.setHours(23, 59, 59, 999);
            const diff = deadline - now;
            const countdownElement = document.getElementById('countdownText');
            if (diff <= 0) {
                countdownElement.textContent = "今日報數截止";
                return;
            }
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            countdownElement.textContent = `截止倒數 ${h}:${m}:${s}`;
        }

        // ==================== 核心數據操作 ====================
        async function submitWeight() {
            const weightVal = document.getElementById('currentWeight').value;
            if (!weightVal || isNaN(parseFloat(weightVal))) {
                showStatus("請輸入有效的體重數據！", "error");
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = "上傳中...";
            showStatus("正在提交數據...", "info");

            try {
                const { error } = await supabaseClient
                    .from('weight_logs')
                    .insert([{ user_id: userId, weight: parseFloat(weightVal) }]);

                if (error) throw error;

                showStatus("✅ 報數成功！", "success");
                document.getElementById('currentWeight').value = '';
                document.getElementById('myStatusDot').className = "absolute -bottom-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-white shadow-sm";

                await refreshGrid(true);
                showRealtimeAlert("你的體重數據已更新！");

                const ci = getChallengeInfo();
                if (!ci.isOffPeriod && !ci.isRestDay) {
                    setTimeout(openModal, 500);
                }
            } catch (error) {
                console.error("報數失敗:", error);
                showStatus("❌ 報數失敗，請檢查網路或稍後重試", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "送出數據並看知識";
            }
        }

        async function sendReminder(targetId, btnElement) {
            const ci = getChallengeInfo();
            if (ci.isOffPeriod) {
                alert("當前是間隔期，讓隊友好好休息吧！");
                return;
            }

            if (btnElement.textContent !== "🔔 催一下") return;

            const originalText = btnElement.innerHTML;
            btnElement.classList.add('bell-active');
            btnElement.innerHTML = '⌛...';
            btnElement.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('reminders')
                    .insert([{ from_name: myUsername, to_user_id: targetId }]);

                if (error) throw error;

                btnElement.innerHTML = '✅ 已提醒';
                setTimeout(() => {
                    btnElement.classList.remove('bell-active');
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                }, 1500);
            } catch (error) {
                console.error("提醒失敗:", error);
                btnElement.innerHTML = '❌ 失敗';
                setTimeout(() => {
                    btnElement.classList.remove('bell-active');
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                }, 1500);
            }
        }

        // ==================== 小組戰報渲染 ====================
        async function refreshGrid(force = false) {
            const GRID_CACHE_DURATION = 10000;
            const now = Date.now();

            if (!force && appState.isRefreshing) {
                console.log('刷新操作進行中，跳過');
                return;
            }

            if (!force && (now - appState.lastGridUpdate < GRID_CACHE_DURATION) && appState.memberCache) {
                console.log('使用緩存數據');
                renderMemberGrid(appState.memberCache);
                return;
            }

            appState.isRefreshing = true;
            appState.lastGridUpdate = now;
            const refreshBtn = document.getElementById('refreshButton');
            if (refreshBtn) refreshBtn.disabled = true;

            const grid = document.getElementById('gridContainer');
            grid.innerHTML = `<div class="col-span-3 flex items-center justify-center"><div class="text-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-2"></div><div class="text-gray-500 text-sm">載入中...</div></div></div>`;

            try {
                // 1. 獲取小組成員
                const { data: members, error: membersError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('group_code', groupCode);

                if (membersError) throw membersError;
                if (!members || members.length === 0) {
                    grid.innerHTML = `<div class="col-span-3 text-center p-8"><div class="text-gray-500">小組還沒有成員</div></div>`;
                    appState.memberCache = null;
                    return;
                }

                const memberIds = members.map(m => m.id);
                const today = new Date();
                const todayStr = today.toISOString().split('T')[0];
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];

                // 2. 並行查詢今日和昨日體重
                const [
                    { data: todayWeights, error: todayError },
                    { data: yesterdayWeights, error: yesterdayError }
                ] = await Promise.all([
                    supabaseClient
                        .from('weight_logs')
                        .select('user_id, weight, created_at')
                        .in('user_id', memberIds)
                        .gte('created_at', todayStr + 'T00:00:00')
                        .lte('created_at', todayStr + 'T23:59:59')
                        .order('created_at', { ascending: false }),
                    supabaseClient
                        .from('weight_logs')
                        .select('user_id, weight')
                        .in('user_id', memberIds)
                        .gte('created_at', yesterdayStr + 'T00:00:00')
                        .lte('created_at', yesterdayStr + 'T23:59:59')
                ]);

                if (todayError) throw todayError;
                if (yesterdayError) console.warn("獲取昨日體重失敗（可忽略）:", yesterdayError);

                // 3. 建立查找表並處理數據
                const todayMap = {};
                const yesterdayMap = {};
                todayWeights?.forEach(log => {
                    if (!todayMap[log.user_id] || new Date(log.created_at) > new Date(todayMap[log.user_id].created_at)) {
                        todayMap[log.user_id] = log;
                    }
                });
                yesterdayWeights?.forEach(log => { yesterdayMap[log.user_id] = log; });

                let reportCount = 0;
                const processedMembers = members.map(member => {
                    const todayLog = todayMap[member.id];
                    const yesterdayLog = yesterdayMap[member.id];
                    const hasReported = !!todayLog;
                    const latestWeight = todayLog?.weight;
                    const previousWeight = yesterdayLog?.weight;

                    if (hasReported) {
                        reportCount++;
                        if (member.id === userId) {
                            document.getElementById('myStatusDot').className = "absolute -bottom-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-white shadow-sm";
                        }
                    }

                    return {
                        ...member,
                        hasReportedToday: hasReported,
                        latestWeight: latestWeight,
                        previousWeight: previousWeight,
                        todayLog: todayLog,
                        yesterdayLog: yesterdayLog
                    };
                });

                // 4. 更新進度條
                const progressPercent = members.length > 0 ? (reportCount / members.length) * 100 : 0;
                const progressBar = document.getElementById('progressBar');
                progressBar.style.width = `${progressPercent}%`;
                document.getElementById('progressText').textContent = `${reportCount} / ${members.length}`;

                const mottoElement = document.getElementById('progressMotto');
                const ci = getChallengeInfo();
                if (ci.isOffPeriod) {
                    mottoElement.textContent = "⏸️ 間隔期，保持記錄習慣！";
                } else if (ci.isRestDay) {
                    mottoElement.textContent = "🏖️ 休息日也要記得記錄體重喔！";
                } else if (progressPercent >= 80) {
                    mottoElement.textContent = "🔥 團隊力量大，快完成了！";
                } else if (progressPercent >= 50) {
                    mottoElement.textContent = "💪 過半了，繼續保持！";
                } else {
                    mottoElement.textContent = "✨ 堅持，是為了看見更好的自己";
                }

                // 5. 渲染並緩存結果
                appState.memberCache = processedMembers;
                renderMemberGrid(processedMembers);
                updateLastUpdateTime();

            } catch (error) {
                console.error("刷新戰報失敗:", error);
                grid.innerHTML = `
                    <div class="col-span-3 text-center p-8">
                        <div class="text-red-500 mb-2">❌ 載入戰報失敗</div>
                        <div class="text-sm text-gray-500">請檢查網路連線後重試</div>
                        <button onclick="refreshGrid(true)" class="mt-3 text-sm text-blue-500 underline">點擊重試</button>
                    </div>`;
                appState.memberCache = null;
            } finally {
                appState.isRefreshing = false;
                const refreshBtnFinal = document.getElementById('refreshButton');
                if (refreshBtnFinal) {
                    refreshBtnFinal.disabled = false;
                    refreshBtnFinal.innerHTML = `<span>🔄 刷新</span><span id="lastUpdateTime" class="text-[8px]">${document.getElementById('lastUpdateTime').textContent}</span>`;
                }
            }
        }

        function renderMemberGrid(memberData) {
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            const ci = getChallengeInfo();

            memberData.forEach((member) => {
                const isMe = member.id === userId;
                const hasReported = member.hasReportedToday;
                const statusColor = hasReported ? 'bg-green-500' : 'bg-red-500 status-pulse';
                const avatarBorder = hasReported ? 'border-blue-400 shadow-blue-100' : 'border-gray-300 opacity-70';

                // 計算體重差
                let diffHtml = '';
                if (hasReported) {
                    if (member.previousWeight) {
                        const diff = (member.latestWeight - member.previousWeight).toFixed(1);
                        if (diff < 0) {
                            diffHtml = `<span class="text-green-500 font-bold text-[10px]">⬇️${Math.abs(diff)}</span>`;
                        } else if (diff > 0) {
                            diffHtml = `<span class="text-red-400 font-bold text-[10px]">⬆️${diff}</span>`;
                        } else {
                            diffHtml = `<span class="text-gray-400 text-[10px]">持平</span>`;
                        }
                    } else {
                        diffHtml = `<span class="text-blue-400 text-[10px] font-bold">START</span>`;
                    }
                } else {
                    if (!ci.isOffPeriod && !isMe) {
                        diffHtml = `<button onclick="sendReminder('${member.id}', this)" class="mt-1 bg-white text-gray-600 text-[10px] px-2 py-1 rounded-lg border border-gray-200 shadow-sm font-bold active:scale-90 transition-all">🔔 催一下</button>`;
                    } else {
                        diffHtml = `<span class="text-[10px] text-gray-400 font-bold">等待中</span>`;
                    }
                }

                const displayWeight = hasReported ? (member.latestWeight?.toFixed(1) || '--') : '--';
                const card = document.createElement('div');
                card.className = `relative flex flex-col items-center justify-center p-2 rounded-2xl transition-all cursor-pointer ${isMe ? 'bg-white shadow-md ring-2 ring-blue-400' : 'bg-white/60'}`;
                card.innerHTML = `
                    <div class="relative mb-2">
                        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(member.username)}"
                             class="w-10 h-10 rounded-xl bg-gray-50 border-2 ${avatarBorder} shadow-sm" alt="${member.username}">
                        <div class="absolute -bottom-1 -right-1 w-3 h-3 ${statusColor} rounded-full border-2 border-white shadow-sm"></div>
                    </div>
                    <div class="text-[10px] font-black text-gray-700 truncate w-full text-center mb-0.5">${member.username}${isMe ? ' (我)' : ''}</div>
                    <div class="text-xs font-black ${hasReported ? 'text-blue-600' : 'text-gray-300'}">${displayWeight}</div>
                    <div class="mt-1">${diffHtml}</div>
                `;
                card.onclick = () => {
                    if (hasReported) {
                        let info = `${member.username}\n`;
                        info += `今日體重: ${member.latestWeight?.toFixed(1) || '--'}kg\n`;
                        if (member.previousWeight) {
                            const diff = (member.latestWeight - member.previousWeight).toFixed(1);
                            info += `昨日體重: ${member.previousWeight?.toFixed(1) || '--'}kg\n`;
                            info += `變化: ${diff > 0 ? '+' + diff : diff}kg`;
                        }
                        alert(info);
                    }
                };
                grid.appendChild(card);
            });

            // 補齊空位
            const emptyCount = 9 - memberData.length;
            for (let i = 0; i < emptyCount; i++) {
                const emptyCard = document.createElement('div');
                emptyCard.className = "flex flex-col items-center justify-center p-2 rounded-2xl bg-gray-50/50 border-2 border-dashed border-gray-200";
                emptyCard.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-gray-100 border-2 border-dashed border-gray-300 mb-2 flex items-center justify-center text-gray-400 text-xl">+</div>
                    <div class="text-[10px] text-gray-400 font-bold">等待加入</div>
                `;
                grid.appendChild(emptyCard);
            }
        }

        // ==================== 提醒檢查 ====================
        async function checkReminders() {
            try {
                const { data, error } = await supabaseClient
                    .from('reminders')
                    .select('id, from_name')
                    .eq('to_user_id', userId)
                    .eq('is_read', false);

                if (error) throw error;
                if (data && data.length > 0) {
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    const names = [...new Set(data.map(r => r.from_name))].join('、');
                    alert(`🔔 隊友 [${names}] 正在提醒你報數喔！🏃‍♂️`);
                    // 標記為已讀
                    await supabaseClient.from('reminders').update({ is_read: true }).in('id', data.map(r => r.id));
                }
            } catch (error) {
                console.error("檢查提醒失敗:", error);
            }
        }

        // ==================== 實時訂閱 ====================
        function setupRealtimeSubscription() {
            if (realtimeSubscription) {
                supabaseClient.removeChannel(realtimeSubscription);
            }

            realtimeSubscription = supabaseClient
                .channel('weight-log-changes')
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'weight_logs' },
                    async (payload) => {
                        console.log('收到即時更新:', payload);
                        const { data: userProfile } = await supabaseClient
                            .from('profiles')
                            .select('group_code')
                            .eq('id', payload.new.user_id)
                            .single();

                        if (userProfile && userProfile.group_code === groupCode) {
                            showRealtimeAlert("小組成員體重更新中...");
                            setTimeout(async () => {
                                await refreshGrid(true);
                            }, 800);
                        }
                    }
                )
                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'reminders',
                        filter: `to_user_id=eq.${userId}`
                    },
                    () => { checkReminders(); }
                )
                .subscribe((status) => {
                    console.log('即時訂閱狀態:', status);
                    const statusElement = document.getElementById('connectionStatus');
                    if (status === 'SUBSCRIBED') {
                        statusElement.innerHTML = `<div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> 即時連線中`;
                        statusElement.className = "text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-lg font-bold flex items-center gap-1";
                    } else {
                        statusElement.innerHTML = `<div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div> 離線`;
                        statusElement.className = "text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded-lg font-bold flex items-center gap-1";
                    }
                });
        }

        // ==================== 頁面初始化 ====================
        async function initializePage() {
            if (!userId || !groupCode) {
                window.location.href = "index.html";
                return;
            }

            updateDayDisplay();
            updateCountdown();
            setInterval(updateCountdown, 1000);

            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('username')
                    .eq('id', userId)
                    .single();

                if (error) throw error;
                if (data) {
                    myUsername = data.username;
                    document.getElementById('displayUsername').textContent = data.username;
                    document.getElementById('myAvatar').src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(data.username)}`;
                }
            } catch (error) {
                console.error("載入使用者資料失敗:", error);
                showStatus("載入個人資料失敗", "error");
            }

            document.getElementById('groupLabel').textContent = "GROUP: " + groupCode;
            setupRealtimeSubscription();

            const ci = getChallengeInfo();
            const todayStr = new Date().toISOString().split('T')[0];
            const lastSeen = localStorage.getItem('last_seen_info_date');
            if (!ci.isOffPeriod && !ci.isRestDay && lastSeen !== todayStr) {
                localStorage.setItem('last_seen_info_date', todayStr);
                setTimeout(openModal, 1500);
            }

            await refreshGrid();
            await checkReminders();

            setInterval(checkReminders, 30000);
            setInterval(() => refreshGrid(), 120000);

            setTimeout(() => {
                document.getElementById('currentWeight').focus();
            }, 800);
        }

        // 頁面事件
        window.onload = initializePage;
        window.addEventListener('beforeunload', () => {
            if (realtimeSubscription) {
                supabaseClient.removeChannel(realtimeSubscription);
            }
        });
    </script>
</body>
