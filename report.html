        // --- 修正的天數計算邏輯 ---
        function getChallengeInfo() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1; // 1-12
            const day = today.getDate(); // 1-31
            
            // 計算本期開始日（每個月1號和16號）
            let sessionStart;
            if (day >= 1 && day <= 15) {
                // 本期從本月1號開始
                sessionStart = new Date(year, month - 1, 1);
            } else {
                // 本期從本月16號開始
                sessionStart = new Date(year, month - 1, 16);
            }
            
            // 計算本期結束日（開始日+13天）
            const sessionEnd = new Date(sessionStart);
            sessionEnd.setDate(sessionStart.getDate() + 13);
            
            // 計算下期開始日
            let nextSessionStart;
            if (day >= 1 && day <= 15) {
                // 下期從本月16號開始
                nextSessionStart = new Date(year, month - 1, 16);
            } else {
                // 下期從下個月1號開始
                nextSessionStart = new Date(year, month, 1);
            }
            
            // 計算今天是本期的第幾天
            const diffTime = today - sessionStart;
            const dayInSession = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
            
            // 計算期數（從2026年開始計算）
            const startYear = 2026;
            const monthsSinceStart = (year - startYear) * 12 + month;
            const sessionNumber = monthsSinceStart * 2 + (day >= 16 ? 1 : 0) - 1;
            
            // 檢查是否為休息日（第7天和第14天）
            const isRestDay = dayInSession === 7 || dayInSession === 14;
            const isLastDay = dayInSession === 14;
            
            return {
                dayInSession: Math.min(Math.max(dayInSession, 1), 14),
                sessionNumber: sessionNumber,
                sessionStart: sessionStart,
                sessionEnd: sessionEnd,
                nextSessionStart: nextSessionStart,
                isRestDay: isRestDay,
                isLastDay: isLastDay,
                currentDate: today
            };
        }

                return `${date.getMonth() + 1}月${date.getDate()}日`;
            };
            
            sessionStartDateElement.textContent = formatDate(challengeInfo.sessionStart);
            sessionEndDateElement.textContent = formatDate(challengeInfo.sessionEnd);
            nextSessionStartElement.textContent = formatDate(challengeInfo.nextSessionStart);
            
            // 更新期數標籤
            sessionBadgeElement.textContent = `第 ${challengeInfo.sessionNumber} 期`;
            
            // 根據狀態更新標籤和訊息
            if (challengeInfo.isRestDay) {
                badgeElement.textContent = "休息日";
                badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-yellow-100 text-yellow-800";
                messageElement.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-yellow-500">🏖️</span>
                        <span>今天是休息日，可以放鬆一下，也可以繼續記錄體重！</span>
                    </div>
                `;
            } else if (challengeInfo.isLastDay) {
                badgeElement.textContent = "最後一天";
                badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-purple-100 text-purple-800";
                messageElement.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-purple-500">🎉</span>
                        <span>恭喜完成本期挑戰！下期從 ${formatDate(challengeInfo.nextSessionStart)} 開始！</span>
                    </div>
                `;
            } else {
                badgeElement.textContent = "挑戰中";
                badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-green-100 text-green-800";
                messageElement.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-green-500">🔥</span>
                        <span>持續努力，離目標越來越近了！</span>
                    </div>
                `;
            }
        }

        // --- 更新最後更新時間 ---
        function updateLastUpdateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', {
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastUpdateTime').textContent = timeStr;
        }

        // --- 彈窗控制 ---
        function openModal() {
            const challengeInfo = getChallengeInfo();
            const dayInSession = challengeInfo.dayInSession;
            const data = DAILY_CONTENT[dayInSession] || { 
                title: "持續加油！", 
                content: "每一天的堅持都是為了更棒的體態。", 
                tips: "保持記錄，你正走在正確的道路上。", 
                img: "" 
            };
            
            document.getElementById('modalSession').textContent = challengeInfo.sessionNumber;
            document.getElementById('modalDay').innerText = dayInSession;
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalText').innerText = data.content;
            document.getElementById('modalTips').innerText = data.tips;
            
            const imgBox = document.getElementById('modalImage');
            if (data.img) {
                imgBox.innerHTML = `<img src="${data.img}" class="w-full h-full object-cover rounded-xl">`;
            } else {
                imgBox.innerHTML = `<div class="text-center"><span class="text-4xl mb-2">📚</span><br><span>第 ${challengeInfo.sessionNumber} 期 第 ${dayInSession} 天</span></div>`;
            }

            document.getElementById('infoModal').classList.remove('modal-hidden');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('modal-hidden');
        }

        // --- 倒數計時 ---
        function updateCountdown() {
            const now = new Date();
            const deadline = new Date();
            deadline.setHours(23, 59, 59, 999);
            const diff = deadline - now;
            if (diff <= 0) {
                document.getElementById('countdownText').innerText = "今日報數截止";
                return;
            }
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('countdownText').innerText = `截止倒數 ${h}:${m}:${s}`;
        }
        setInterval(updateCountdown, 1000);

        // --- 送出體重（休息日也可以上傳）---
        async function submitWeight() {
            const weightVal = document.getElementById('currentWeight').value;
            if (!weightVal) {
                alert("請輸入體重數據！");
                return;
            }
            
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "上傳中...";

            try {
                const { error } = await _client.from('weight_logs').insert([{ 
                    user_id: userId, 
                    weight: parseFloat(weightVal)
                }]);
                
                if (error) throw error;
                
                document.getElementById('statusMsg').innerHTML = `<div class="text-green-600 font-bold animate-bounce">✅ 報數成功！</div>`;
                document.getElementById('currentWeight').value = '';
                
                // 立即更新自己的顯示
                await refreshGrid();
                
                // 通知其他成員（透過即時訂閱會自動更新）
                showRealtimeAlert("你的體重數據已更新！");
                
                // 只有在非休息日顯示知識彈窗
                const challengeInfo = getChallengeInfo();
                if (!challengeInfo.isRestDay) {
                    setTimeout(openModal, 500);
                }
            } catch (error) {
                console.error("報數失敗:", error);
                alert("報數失敗，請檢查網路連線！");
            }
            
            btn.disabled = false;
            btn.innerText = "送出數據並看知識";
        }

        // --- 顯示即時更新通知 ---
        function showRealtimeAlert(message) {
            const alertElement = document.getElementById('realtimeAlert');
            alertElement.classList.remove('hidden');
            alertElement.querySelector('span').textContent = message || "小組戰報已更新！";
            
            setTimeout(() => {
                alertElement.classList.add('hidden');
            }, 3000);
        }

        // --- 提醒隊友 ---
        async function sendReminder(targetId, btnElement) {
            const challengeInfo = getChallengeInfo();
            
            btnElement.classList.add('bell-active');
            btnElement.innerText = "⌛...";
            
            try {
                const { error } = await _client.from('reminders').insert([{ 
                    from_name: myUsername, 
                    to_user_id: targetId
                }]);
                
                if(error) throw error;
                
                btnElement.innerText = "✅ 已提醒";
                setTimeout(() => {
                    btnElement.classList.remove('bell-active');
                    btnElement.innerText = "🔔 催一下";
                }, 1500);
            } catch (error) {
                btnElement.innerText = "❌ 失敗";
                setTimeout(() => {
                    btnElement.classList.remove('bell-active');
                    btnElement.innerText = "🔔 催一下";
                }, 1500);
            }
        }

        // --- 檢查提醒 ---
        async function checkReminders() {
            try {
                const { data, error } = await _client.from('reminders')
                    .select('id, from_name')
                    .eq('to_user_id', userId)
                    .eq('is_read', false);
                    
                if (error) throw error;
                
                if (data && data.length > 0) {
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    const names = [...new Set(data.map(r => r.from_name))].join('、');
                    alert(`🔔 隊友 [${names}] 正在提醒你報數喔！🏃‍♂️`);
                    await _client.from('reminders').update({ is_read: true }).in('id', data.map(r => r.id));
                }
            } catch (error) {
                console.error("檢查提醒失敗:", error);
            }
        }

        // --- 即時訂閱 Supabase Realtime ---
        function setupRealtimeSubscription() {
            if (realtimeSubscription) {
                _client.removeChannel(realtimeSubscription);
            }
            
            // 訂閱 weight_logs 表的 INSERT 事件
            realtimeSubscription = _client
                .channel('weight-log-changes')
                .on(
                    'postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'weight_logs'
                    },
                    async (payload) => {
                        console.log('收到即時更新:', payload);
                        
                        // 檢查是否為同組成員
                        const { data: userProfile } = await _client
                            .from('profiles')
                            .select('group_code')
                            .eq('id', payload.new.user_id)
                            .single();
                        
                        if (userProfile && userProfile.group_code === groupCode) {
                            console.log('同組成員體重更新，立即刷新戰報');
                            showRealtimeAlert("小組成員體重更新中...");
                            
                            // 延遲 500ms 後刷新，確保資料庫已完全更新
                            setTimeout(async () => {
                                await refreshGrid();
                                updateLastUpdateTime();
                            }, 500);
                        }
                    }
                )
                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'reminders',
                        filter: `to_user_id=eq.${userId}`
                    },
                    () => {
                        // 當提醒被更新時，檢查是否有新提醒
                        checkReminders();
                    }
                )
                .subscribe((status) => {
                    console.log('即時訂閱狀態:', status);
                    const statusElement = document.getElementById('connectionStatus');
                    if (status === 'SUBSCRIBED') {
                        statusElement.innerHTML = `<div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> 即時連線中`;
                        statusElement.className = "text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-lg font-bold flex items-center gap-1";
                    } else {
                        statusElement.innerHTML = `<div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div> 離線`;
                        statusElement.className = "text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded-lg font-bold flex items-center gap-1";
                    }
                });
        }

        // --- 緩存系統：避免重複查詢 ---
        let lastGridUpdate = 0;
        const GRID_CACHE_DURATION = 5000; // 5秒內不重複查詢

        // --- 刷新小組戰報 ---
        async function refreshGrid(force = false) {
            const now = Date.now();
            
            // 避免頻繁刷新
            if (!force && (now - lastGridUpdate < GRID_CACHE_DURATION)) {
                console.log('避免頻繁刷新，使用快取');
                return;
            }
            
            lastGridUpdate = now;
            
            const challengeInfo = getChallengeInfo();
            const today = challengeInfo.currentDate;
            const todayStr = today.toISOString().split('T')[0];
            
            try {
                // 1. 獲取小組成員
                const { data: members, error: membersError } = await _client
                    .from('profiles')
                    .select('*')
                    .eq('group_code', groupCode);
                
                if (membersError) throw membersError;
                if (!members || members.length === 0) {
                    document.getElementById('gridContainer').innerHTML = `
                        <div class="col-span-3 text-center p-8">
                            <div class="text-gray-500">小組還沒有成員</div>
                        </div>`;
                    return;
                }

                let reportCount = 0;
                const grid = document.getElementById('gridContainer');
                
                // 2. 一次性獲取所有成員的今日體重（優化查詢）
                const memberIds = members.map(m => m.id);
                
                // 查詢今天所有成員的體重
                const { data: todayWeights, error: weightsError } = await _client
                    .from('weight_logs')
                    .select('user_id, weight, created_at')
                    .in('user_id', memberIds)
                    .gte('created_at', todayStr + 'T00:00:00')
                    .lte('created_at', todayStr + 'T23:59:59')
                    .order('created_at', { ascending: false });
                
                if (weightsError) throw weightsError;
                
                // 查詢昨天所有成員的體重
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];
                
                const { data: yesterdayWeights, error: yesterdayError } = await _client
                    .from('weight_logs')
                    .select('user_id, weight')
                    .in('user_id', memberIds)
                    .gte('created_at', yesterdayStr + 'T00:00:00')
                    .lte('created_at', yesterdayStr + 'T23:59:59');
                
                if (yesterdayError) console.warn("獲取昨天體重失敗:", yesterdayError);
                
                // 建立快速查找表
                const todayWeightMap = {};
                const yesterdayWeightMap = {};
                
                todayWeights?.forEach(log => {
                    if (!todayWeightMap[log.user_id] || 
                        new Date(log.created_at) > new Date(todayWeightMap[log.user_id].created_at)) {
                        todayWeightMap[log.user_id] = log;
                    }
                });
                
                yesterdayWeights?.forEach(log => {
                    if (!yesterdayWeightMap[log.user_id]) {
                        yesterdayWeightMap[log.user_id] = log;
                    }
                });

                // 3. 處理每個成員的資料
                const memberData = members.map(member => {
                    const todayWeight = todayWeightMap[member.id];
                    const yesterdayWeight = yesterdayWeightMap[member.id];
                    
                    // 休息日也可以上傳，所以只要今天有上傳就算
                    const hasReportedToday = todayWeight !== undefined;
                    const latestWeight = hasReportedToday ? todayWeight?.weight : null;
                    const previousWeight = yesterdayWeight?.weight || null;
                    
                    if (hasReportedToday) {
                        reportCount++;
                        if (member.id === userId) {
                            document.getElementById('myStatusDot').className = "absolute -bottom-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-white shadow-sm";
                        }
                    }

                    return {
                        ...member,
                        hasReportedToday,
                        latestWeight,
                        previousWeight,
                        todayWeight,
                        yesterdayWeight
                    };
                });

                // 4. 更新進度條
                const progressPercent = (reportCount / members.length * 100);
                document.getElementById('progressBar').style.width = progressPercent + '%';
                document.getElementById('progressText').innerText = `${reportCount} / ${members.length}`;
                
                // 更新格言
                if (challengeInfo.isRestDay) {
                    document.getElementById('progressMotto').textContent = "🏖️ 休息日也要記得記錄體重喔！";
                } else if (progressPercent >= 80) {
                    document.getElementById('progressMotto').textContent = "🔥 團隊力量大，快完成了！";
                } else if (progressPercent >= 50) {
                    document.getElementById('progressMotto').textContent = "💪 過半了，繼續保持！";
                } else {
                    document.getElementById('progressMotto').textContent = "✨ 堅持，是為了看見更好的自己";
                }

                // 5. 渲染九宮格
                grid.innerHTML = '';
                memberData.forEach((member, index) => {
                    const isMe = member.id === userId;
                    let diffHtml = '';
                    
                    // 狀態顏色 - 休息日也顯示綠色（如果有上傳）
                    const statusColor = member.hasReportedToday ? 'bg-green-500' : 'bg-red-500 status-pulse';
                    
                    const avatarBorder = member.hasReportedToday ? 'border-blue-400 shadow-blue-100' : 'border-gray-300 opacity-70';

                    if (member.hasReportedToday) {
                        if (member.previousWeight) {
                            const diff = (member.latestWeight - member.previousWeight).toFixed(1);
                            if (diff < 0) {
                                diffHtml = `<span class="text-green-500 font-bold text-[10px]">⬇️${Math.abs(diff)}</span>`;
                            } else if (diff > 0) {
                                diffHtml = `<span class="text-red-400 font-bold text-[10px]">⬆️${diff}</span>`;
                            } else {
                                diffHtml = `<span class="text-gray-400 text-[10px]">持平</span>`;
                            }
                        } else {
                            diffHtml = `<span class="text-blue-400 text-[10px] font-bold">START</span>`;
                        }
                    } else {
                        if (!isMe) {
                            diffHtml = `<button onclick="sendReminder('${member.id}', this)" class="mt-1 bg-white text-gray-600 text-[10px] px-2 py-1 rounded-lg border border-gray-200 shadow-sm font-bold active:scale-90 transition-all">🔔 催一下</button>`;
                        } else {
                            diffHtml = `<span class="text-[10px] text-gray-400 font-bold">等待中</span>`;
                        }
                    }

                    // 顯示體重數值
                    const displayWeight = member.hasReportedToday ? (member.latestWeight?.toFixed(1) || '--') : '--';

                    const card = document.createElement('div');
                    card.className = `relative flex flex-col items-center justify-center p-2 rounded-2xl transition-all ${isMe ? 'bg-white shadow-md ring-2 ring-blue-400' : 'bg-white/60'}`;
                    card.innerHTML = `
                        <div class="relative mb-2">
                            <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(member.username)}" 
                                 class="w-10 h-10 rounded-xl bg-gray-50 border-2 ${avatarBorder} shadow-sm">
                            <div class="absolute -bottom-1 -right-1 w-3 h-3 ${statusColor} rounded-full border-2 border-white shadow-sm"></div>
                        </div>
                        <div class="text-[10px] font-black text-gray-700 truncate w-full text-center mb-0.5">${member.username}${isMe ? ' (我)' : ''}</div>
                        <div class="text-xs font-black ${member.hasReportedToday ? 'text-blue-600' : 'text-gray-300'}">
                            ${displayWeight}
                        </div>
                        <div class="mt-1">${diffHtml}</div>
                    `;
                    
                    // 添加點擊顯示詳細資訊功能
                    card.onclick = () => {
                        if (member.hasReportedToday) {
                            let info = `${member.username}\n`;
                            info += `今日體重: ${member.latestWeight?.toFixed(1) || '--'}kg\n`;
                            if (member.previousWeight) {
                                const diff = (member.latestWeight - member.previousWeight).toFixed(1);
                                info += `昨日體重: ${member.previousWeight?.toFixed(1) || '--'}kg\n`;
                                info += `變化: ${diff > 0 ? '+' + diff : diff}kg`;
                            }
                            alert(info);
                        }
                    };
                    
                    grid.appendChild(card);
                });

                // 如果成員不足9個，補齊空位
                const emptyCount = 9 - memberData.length;
                for (let i = 0; i < emptyCount; i++) {
                    const emptyCard = document.createElement('div');
                    emptyCard.className = "flex flex-col items-center justify-center p-2 rounded-2xl bg-gray-50/50 border-2 border-dashed border-gray-200";
                    emptyCard.innerHTML = `
                        <div class="w-10 h-10 rounded-xl bg-gray-100 border-2 border-dashed border-gray-300 mb-2 flex items-center justify-center text-gray-400 text-xl">+</div>
                        <div class="text-[10px] text-gray-400 font-bold">等待加入</div>
                    `;
                    grid.appendChild(emptyCard);
                }

                // 更新最後更新時間
                updateLastUpdateTime();

            } catch (error) {
                console.error("刷新小組戰報失敗:", error);
                document.getElementById('gridContainer').innerHTML = `
                    <div class="col-span-3 text-center p-8">
                        <div class="text-red-500 mb-2">❌ 載入戰報失敗</div>
                        <div class="text-sm text-gray-500">${error.message}</div>
                        <button onclick="refreshGrid(true)" class="mt-3 text-sm text-blue-500 underline">重試</button>
                    </div>`;
            }
        }

        // --- 頁面載入 ---
        window.onload = async () => {
            if (!userId) { 
                window.location.href = "index.html"; 
                return; 
            }
            
            updateDayDisplay();
            updateLastUpdateTime();
            
            try {
                const { data, error } = await _client.from('profiles')
                    .select('username')
                    .eq('id', userId)
                    .single();
                    
                if (error) throw error;
                
                if (data) {
                    document.getElementById('displayUsername').innerText = data.username;
                    document.getElementById('myAvatar').src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(data.username)}`;
                    myUsername = data.username;
                }
            } catch (error) {
                console.error("載入使用者資料失敗:", error);
            }
            
            document.getElementById('groupLabel').innerText = "GROUP: " + groupCode;

            // 設置即時訂閱
            setupRealtimeSubscription();

            const challengeInfo = getChallengeInfo();
            const todayStr = new Date().toISOString().split('T')[0];
            const lastSeen = localStorage.getItem('last_seen_info_date');
            
            // 非休息日且今天還沒看過知識彈窗時顯示
            if (lastSeen !== todayStr && !challengeInfo.isRestDay) {
                localStorage.setItem('last_seen_info_date', todayStr);
                setTimeout(openModal, 1500);
            }

            updateCountdown(); 
            await refreshGrid();
            checkReminders();
            
            // 自動刷新（備用方案，如果即時訂閱失效）
            setInterval(checkReminders, 30000);
            setInterval(() => refreshGrid(), 60000); // 每分鐘刷新一次作為備份
            
            setTimeout(() => {
                document.getElementById('currentWeight').focus();
            }, 1000);
        };

        // 頁面卸載時清理訂閱
        window.addEventListener('beforeunload', () => {
            if (realtimeSubscription) {
                _client.removeChannel(realtimeSubscription);
            }
        });
    </script>
</body>
