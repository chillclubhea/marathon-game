<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3663/3663335.png">
    <meta name="apple-mobile-web-app-title" content="馬拉松報數">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日報數 - 馬拉松挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        input { user-select: auto; }
        #danmu-layer { position: fixed; top: 0; left: 0; width: 100%; height: 50%; pointer-events: none; z-index: 100; overflow: hidden; }
        .danmu { position: absolute; white-space: nowrap; font-weight: bold; font-size: 1.25rem; color: #f97316; text-shadow: 1px 1px 2px white, -1px -1px 2px white; animation: danmu-run 5s linear forwards; }
        @keyframes danmu-run { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 pb-20">
    <div class="max-w-md mx-auto mb-6 bg-white rounded-2xl p-4 shadow-sm border border-blue-50">
        <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-bold text-gray-600">💪 全隊今日報數進度</span>
            <span id="countdownText" class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded-md font-mono">截止倒數 --:--:--</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden mb-2">
            <div id="progressBar" class="bg-gradient-to-r from-blue-400 to-blue-600 h-full transition-all duration-1000" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center mb-2">
            <p id="progressMotto" class="text-[10px] text-gray-400 italic">載入中...</p>
            <span id="progressText" class="text-sm font-black text-blue-600">0 / 0</span>
        </div>

        <div id="adviceBox" class="hidden mt-4 bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-xl">
            <h4 class="font-bold text-blue-800 text-sm mb-2">💡 專屬你的今日建議</h4>
            <ul id="adviceList" class="text-[11px] text-blue-700 space-y-1.5 leading-relaxed"></ul>
        </div>
    </div>

    <div id="danmu-layer"></div>

    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-600">📊 每日報數</h1>
            <a href="index.html" class="text-xs bg-gray-200 px-3 py-1 rounded-full text-gray-600">返回登記</a>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 border-t-4 border-blue-500">
            <div id="userInfo" class="mb-4 text-center">
                <p class="text-gray-500 text-sm">歡迎回來</p>
                <h2 id="displayUsername" class="text-xl font-bold text-gray-800">載入中...</h2>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-center text-sm font-medium text-gray-500 mb-2">今日體重 (kg)</label>
                    <input type="number" id="currentWeight" step="0.1" class="block w-full text-center text-3xl font-black border-2 border-blue-100 rounded-xl p-4 focus:border-blue-500 focus:outline-none" placeholder="00.0">
                </div>
                <button onclick="submitWeight()" id="btnSubmit" class="w-full bg-blue-600 text-white text-lg font-bold py-4 rounded-xl shadow-lg active:scale-95 transition">送出今日數據</button>
            </div>
            <div id="statusMsg" class="mt-4 text-center text-sm"></div>
        </div>

        <div class="mb-4 flex justify-between items-end">
            <h3 class="text-lg font-bold text-gray-800">🏆 小組即時戰報</h3>
            <span id="groupLabel" class="text-xs text-blue-500 font-bold"></span>
        </div>
        <div id="gridContainer" class="grid grid-cols-3 gap-2 bg-gray-200 p-2 rounded-2xl shadow-inner min-h-[300px]"></div>
    </div>

    <script>
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        
        const THEMES = {
            christmas: { name: '聖誕節', match: (d) => d.getMonth() === 11 && d.getDate() >= 20, border: 'border-red-500', bg: 'bg-green-50', icon: '🎄', motto: '🎅 聖誕快樂！燃燒熱量就是最好的禮物！' },
            cny: { name: '農曆新年', match: (d) => (d.getMonth() === 0 && d.getDate() >= 25) || (d.getMonth() === 1 && d.getDate() <= 5), border: 'border-yellow-500', bg: 'bg-red-50', icon: '🧧', motto: '🧨 恭喜發財！紅包拿來，脂肪拿走！' },
            default: { border: 'border-blue-400', bg: 'bg-blue-50', icon: '👑', motto: '「一個人走得快，一群人走得遠」' }
        };

        function getActiveTheme() {
            const now = new Date();
            if (THEMES.christmas.match(now)) return THEMES.christmas;
            if (THEMES.cny.match(now)) return THEMES.cny;
            return THEMES.default;
        }

        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);
        const userId = localStorage.getItem('my_user_id');
        const groupCode = localStorage.getItem('my_group_code');

        function playSound(type) {
            const audio = new Audio(type === 'win' ? "https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" : "https://assets.mixkit.co/active_storage/sfx/133/133-preview.mp3");
            audio.play().catch(() => {});
        }

        async function knockBowl(targetName, targetId) {
            if (targetId === userId) return;
            await _client.channel(`user_${targetId}`).send({ type: 'broadcast', event: 'knock', payload: { from: document.getElementById('displayUsername').innerText } });
            alert(`已向 ${targetName} 敲碗催促！🍜`);
        }

        function updateCountdown() {
            const now = new Date();
            const deadline = new Date();
            deadline.setHours(12, 0, 0, 0);
            if (now > deadline) deadline.setDate(deadline.getDate() + 1);
            const diff = deadline - now;
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('countdownText').innerText = `截止倒數 ${h}:${m}:${s}`;
        }
        setInterval(updateCountdown, 1000);

        function createDanmu(text) {
            const layer = document.getElementById('danmu-layer');
            const danmu = document.createElement('div');
            danmu.className = 'danmu';
            danmu.innerText = text;
            danmu.style.top = (Math.floor(Math.random() * 80) + 10) + '%';
            layer.appendChild(danmu);
            danmu.addEventListener('animationend', () => danmu.remove());
        }

        window.onload = async () => {
            if (!userId) { window.location.href = "index.html"; return; }
            _client.channel(`user_${userId}`).on('broadcast', { event: 'knock' }, (payload) => {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                alert(`📢 ${payload.payload.from} 正在瘋狂敲碗叫你報數！`);
            }).subscribe();

            const { data } = await _client.from('profiles').select('username').eq('id', userId).single();
            if (data) {
                document.getElementById('displayUsername').innerText = data.username;
                document.getElementById('groupLabel').innerText = "小組：" + groupCode;
            }
            await refreshGrid();
            playbackRecentDanmu();
        };

        function generatePersonalAdvice(currentWeight, profile) {
            let advices = [];
            const now = new Date();
            if (profile.gender === 'female' && profile.last_period_date) {
                const lastPeriod = new Date(profile.last_period_date);
                const daysDiff = Math.floor((now - lastPeriod) / (1000 * 60 * 60 * 24)) % 28;
                if (daysDiff >= 21 || daysDiff <= 3) advices.push("🌸 生理期水腫提示：目前處於易水腫期，體重微升是正常的，放鬆心情！");
            }
            advices.push(`🥩 蛋白質建議：你今日需攝取約 ${Math.round(currentWeight * 1.2)}g 蛋白質。`);
            if (profile.target_weight) {
                if ((currentWeight - profile.target_weight) > 10) advices.push("🎯 目標建議：大目標路長，先以「瘦 2kg」為本週小目標。");
                advices.push("🔥 熱量建議：建議今日攝取 1600-1800 卡，創造健康缺口。");
            }
            if (now.getHours() >= 22 || now.getHours() <= 4) advices.push("🌙 睡眠提醒：報數較晚，睡眠不足會提升皮質醇影響代謝，快去睡吧！");
            advices.push("👟 動力建議：報數完成！餐後散步 15 分鐘，減脂效果更佳。");
            return advices;
        }

        async function submitWeight() {
            const weightVal = document.getElementById('currentWeight').value;
            if (!weightVal) return alert("請輸入數字");
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "傳送中...";

            const { error } = await _client.from('weight_logs').insert([{ user_id: userId, weight: parseFloat(weightVal) }]);
            
            if (error) {
                alert("錯誤：" + error.message);
            } else {
                const { data: profile } = await _client.from('profiles').select('*').eq('id', userId).single();
                const diff = parseFloat(weightVal) - (profile.initial_weight || 0);
                playSound(diff < 0 ? 'win' : 'fail');
                createDanmu(`🔥 賀！${profile.username} 報數成功！`);
                async function submitWeight() {
            // ... 前面的代碼 (取得重量、禁用按鈕等) ...

            const { error } = await _client.from('weight_logs').insert([{ user_id: userId, weight: parseFloat(weightVal) }]);
            
            if (error) {
                alert("錯誤：" + error.message);
            } else {
                // --- 成功後的處理 ---
                const { data: profile } = await _client.from('profiles').select('*').eq('id', userId).single();
                
                // 1. 播放音效與彈幕
                const diff = parseFloat(weightVal) - (profile.initial_weight || 0);
                playSound(diff < 0 ? 'win' : 'fail');
                createDanmu(`🔥 賀！${profile.username} 報數成功！`);

                // 2. 更新 UI 文字
                document.getElementById('statusMsg').innerHTML = "<span class='text-green-500 font-bold'>✅ 報數成功！正在準備您的每日資訊...</span>";
                document.getElementById('currentWeight').value = '';

                // 3. ✨ 重要：延遲 1.5 秒後彈出每日資訊頁面
                setTimeout(() => {
                    openHealthModal();
                }, 1500);

                await refreshGrid();
            }
            btn.disabled = false;
            btn.innerText = "送出今日數據";
        }

        // 控制彈窗的函數
        function openHealthModal() {
            document.getElementById('healthModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // 禁止底層捲動
        }

        function closeHealthModal() {
            document.getElementById('healthModal').classList.add('hidden');
            document.body.style.overflow = 'auto'; // 恢復捲動
        }
                
                const advices = generatePersonalAdvice(parseFloat(weightVal), profile);
                const adviceList = document.getElementById('adviceList');
                adviceList.innerHTML = advices.map(a => `<li>• ${a}</li>`).join('');
                document.getElementById('adviceBox').classList.remove('hidden');
                document.getElementById('statusMsg').innerHTML = `
    <span class='text-green-500 font-bold'>✅ 報數成功！</span>
    <br>
    <a href="consultant.html" class="mt-2 inline-block text-xs bg-green-500 text-white px-4 py-2 rounded-full">查看管理師專業方案</a>
`;
                document.getElementById('statusMsg').innerHTML = "<span class='text-green-500 font-bold'>✅ 報數成功！建議已更新</span>";
                document.getElementById('currentWeight').value = '';
                await refreshGrid();
            }
            btn.disabled = false;
            btn.innerText = "送出今日數據";

            
        }

       async function refreshGrid() {
            const theme = getActiveTheme();
            document.getElementById('progressMotto').innerText = theme.motto;
            const gridContainer = document.getElementById('gridContainer');
            
            const { data: members } = await _client.from('profiles').select('*').eq('group_code', groupCode);
            if (!members) return;

            let reportCount = 0;
            const memberResults = await Promise.all(members.map(async (m) => {
                const { data: w } = await _client.from('weight_logs').select('weight').eq('user_id', m.id).order('created_at', { ascending: false }).limit(1);
                const latest = w?.[0]?.weight || null;
                if (latest) reportCount++;
                const percent = latest ? ((latest - m.initial_weight) / m.initial_weight * 100) : 0;
                return { ...m, latest, percent: parseFloat(percent.toFixed(2)) };
            }));

            document.getElementById('progressBar').style.width = (reportCount / members.length * 100) + '%';
            document.getElementById('progressText').innerText = `${reportCount} / ${members.length}`;

            memberResults.sort((a, b) => a.percent - b.percent);
            gridContainer.innerHTML = '';

            memberResults.forEach((m, i) => {
                const card = document.createElement('div');
                const isMe = m.id === userId;
                card.className = `aspect-square flex flex-col items-center justify-center p-1 rounded-xl shadow-sm border-2 relative transition-all ${isMe ? theme.bg + ' ' + theme.border : 'bg-white border-transparent'}`;
                
                if (!m.latest) {
                    card.onclick = () => knockBowl(m.username, m.id);
                    card.classList.add('cursor-pointer', 'opacity-60');
                }

                const topIcon = (i === 0 && m.percent < 0) ? `<div class="absolute -top-1 -right-1 text-lg">${theme.icon}</div>` : '';
                const diffHtml = m.latest ? `<div class="text-[10px] ${m.percent < 0 ? 'text-green-500 font-bold' : 'text-gray-400'}">${m.percent}%</div>` : `<div class="text-[9px] text-gray-400 italic">點擊敲碗</div>`;

                // 移除原有的 <br> 讓佈局更緊湊
                card.innerHTML = `${topIcon}
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(m.username)}" class="w-8 h-8 rounded-full mb-1">
                    <div class="text-[10px] font-bold text-gray-700 truncate w-full text-center">${m.username}</div>
                    <div class="text-sm font-black text-blue-600">${m.latest || '--'}<span class="text-[8px] text-gray-400">kg</span></div>
                    ${diffHtml}`;
                gridContainer.appendChild(card);
            });

            for (let i = memberResults.length; i < 9; i++) {
                gridContainer.innerHTML += `<div class="bg-gray-50/50 aspect-square flex items-center justify-center rounded-xl text-gray-200 text-xl font-light">+</div>`;
            }
        }
        
        // 修正：aasync 改為 async
        async function playbackRecentDanmu() {
            const { data: logs, error } = await _client
                .from('weight_logs')
                .select('weight, profiles(username, initial_weight, group_code)')
                .eq('profiles.group_code', groupCode)
                .order('created_at', { ascending: false })
                .limit(5);

            if (error || !logs) return;

            const validLogs = logs.filter(log => log.profiles !== null);

            validLogs.reverse().forEach((log, index) => {
                const username = log.profiles?.username || '某位隊員';
                const initialWeight = log.profiles?.initial_weight || 0;
                const diff = (log.weight - initialWeight).toFixed(1);
                
                const msg = diff < 0 
                    ? `🔥 戰報：${username} 剛才又瘦了 ${Math.abs(diff)}kg！` 
                    : `📢 隊員 ${username} 完成今日報數！`;
                    
                setTimeout(() => createDanmu(msg), index * 2000);
            });
        }
    </script>

    <div id="healthModal" class="fixed inset-0 z-[200] hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
            <h3 class="font-bold text-gray-700">📜 每日健康小知識</h3>
            <button onclick="closeHealthModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto">
            <iframe src="health-info.html" class="w-full h-[60vh] border-none"></iframe>
        </div>
        <div class="p-4 bg-white">
            <button onclick="closeHealthModal()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg">我已閱讀，繼續加油！</button>
        </div>
    </div>
</div>
</body>
</html>
