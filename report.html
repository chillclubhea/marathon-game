<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input {
            user-select: auto; 
        }
        /* 彈幕容器層 */
    #danmu-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 50%; /* 彈幕只出現在螢幕上半部，避免遮擋按鈕 */
        pointer-events: none; /* 讓彈幕不影響點擊 */
        z-index: 100;
        overflow: hidden;
    }

    /* 彈幕本體樣式 */
    .danmu {
        position: absolute;
        white-space: nowrap;
        font-weight: bold;
        font-size: 1.25rem;
        color: #f97316; /* 橘色 */
        text-shadow: 1px 1px 2px white, -1px -1px 2px white;
        animation: danmu-run 5s linear forwards;
    }

    @keyframes danmu-run {
        from { transform: translateX(100vw); }
        to { transform: translateX(-100%); }
    }
</style>
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div id="danmu-layer"></div>
    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-600">📊 每日報數</h1>
            <a href="index.html" class="text-xs bg-gray-200 px-3 py-1 rounded-full text-gray-600">返回登記</a>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 border-t-4 border-blue-500">
            <div id="userInfo" class="mb-4 text-center">
                <p class="text-gray-500 text-sm">歡迎回來</p>
                <h2 id="displayUsername" class="text-xl font-bold text-gray-800">載入中...</h2>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-center text-sm font-medium text-gray-500 mb-2">今日體重 (kg)</label>
                    <input type="number" id="currentWeight" step="0.1" 
                        class="block w-full text-center text-3xl font-black border-2 border-blue-100 rounded-xl p-4 focus:border-blue-500 focus:outline-none" 
                        placeholder="00.0">
                </div>
                <button onclick="submitWeight()" id="btnSubmit" class="w-full bg-blue-600 text-white text-lg font-bold py-4 rounded-xl shadow-lg active:scale-95 transition">
                    送出今日數據
                </button>
            </div>
            <div id="statusMsg" class="mt-4 text-center text-sm"></div>
        </div>

        <div class="mb-4 flex justify-between items-end">
            <h3 class="text-lg font-bold text-gray-800">🏆 小組即時戰報</h3>
            <span id="groupLabel" class="text-xs text-blue-500 font-bold"></span>
        </div>
        <div id="gridContainer" class="grid grid-cols-3 gap-2 bg-gray-200 p-2 rounded-2xl shadow-inner"></div>
    </div>

    <div id="addToHomeModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-6">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center">
            <h3 class="text-xl font-bold mb-4">把馬拉松帶在身邊！🏃‍♂️</h3>
            <p id="instructionText" class="text-gray-600 mb-6 text-sm leading-relaxed"></p>
            <button onclick="document.getElementById('addToHomeModal').classList.add('hidden')" 
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">
                我知道了
            </button>
        </div>
    </div>

    <script>
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
// 產生彈幕的函數
function createDanmu(text) {
    const layer = document.getElementById('danmu-layer');
    const danmu = document.createElement('div');
    danmu.className = 'danmu';
    danmu.innerText = text;

    // 隨機高度 (10% ~ 90%)
    const randomTop = Math.floor(Math.random() * 80) + 10;
    danmu.style.top = randomTop + '%';

    layer.appendChild(danmu);

    // 動畫結束後自動移除，釋放記憶體
    danmu.addEventListener('animationend', () => {
        danmu.remove();
    });
}

// 根據報數結果產生成就文字
function triggerSuccessDanmu(username, diff) {
    let message = `${username} 剛剛回報了數據！加油！`;
    
    if (diff < 0) {
        message = `🎉 太強了！${username} 剛剛又瘦了 ${Math.abs(diff)}kg！`;
    } else if (diff > 0) {
        message = `💪 ${username} 正在增肌中！大家一起加油！`;
    } else {
        message = `✨ ${username} 成功維持體重！穩如泰山！`;
    }

    // 連續噴出三條彈幕增加氣氛
    createDanmu(message);
    setTimeout(() => createDanmu(message), 800);
    setTimeout(() => createDanmu(message), 1600);
}
        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        const userId = localStorage.getItem('my_user_id');
        const groupCode = localStorage.getItem('my_group_code');

        // 偵測並引導加入桌面
        function checkPWA() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (isStandalone) return;

            const lastPrompt = localStorage.getItem('last_pwa_prompt');
            const now = new Date().getTime();
            // 為了測試，我們先把時間縮短，讓你立刻看得到 (正式用可以改回 24 小時)
            if (lastPrompt && now - lastPrompt < 5000) return; 

            const modal = document.getElementById('addToHomeModal');
            const text = document.getElementById('instructionText');
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const isAndroid = /Android/.test(navigator.userAgent);

            if (isIOS) {
                text.innerHTML = `請點擊下方瀏覽器的 <span class="font-bold text-blue-500">「分享按鈕」📤</span>，<br>然後選擇 <span class="font-bold text-blue-500">「加入主畫面」➕</span>。`;
                modal.classList.remove('hidden');
            } else if (isAndroid) {
                text.innerHTML = `請點擊右上角 <span class="font-bold text-blue-500">「三個點 ⋮ 」</span>，<br>然後選擇 <span class="font-bold text-blue-500">「加入主畫面」</span>。`;
                modal.classList.remove('hidden');
            }
            localStorage.setItem('last_pwa_prompt', now);
        }

        window.onload = async () => {
            if (!userId) {
                alert("找不到登記資料，請先去登記頁面！");
                window.location.href = "index.html";
                return;
            }
            
            // 執行加入桌面引導
            checkPWA();

            const { data } = await _client.from('profiles').select('username').eq('id', userId).single();
            if (data) {
                document.getElementById('displayUsername').innerText = data.username;
                document.getElementById('groupLabel').innerText = "小組：" + groupCode;
            }
            refreshGrid();
        };

        async function submitWeight() {
            const weight = document.getElementById('currentWeight').value;
            const btn = document.getElementById('btnSubmit');
            if (!weight) return alert("請輸入數字");
            btn.disabled = true;
            btn.innerText = "傳送中...";
            const { error } = await _client.from('weight_logs').insert([{ user_id: userId, weight: parseFloat(weight) }]);
            if (error) {
                alert("錯誤：" + error.message);
            } else {
                document.getElementById('statusMsg').innerHTML = "<span class='text-green-500 font-bold'>✅ 成功！</span>";
                document.getElementById('currentWeight').value = '';
                refreshGrid();
            }
            btn.disabled = false;
            btn.innerText = "送出今日數據";
            // ... 在 submitWeight 函數內 ...
if (error) {
    alert("錯誤：" + error.message);
} else {
    // 1. 取得剛剛輸入的數據與初始體重的差值（為了顯示文字）
    const initialWeight = parseFloat(document.getElementById('initialWeight')?.value || 0); // 這裡需確保能拿到初始體重，或從 profiles 重新抓
    const username = document.getElementById('displayUsername').innerText;
    
    // 這裡我們簡化處理，直接顯示加油訊息
    createDanmu(`🔥 賀！${username} 報數成功！戰況更新中...`);

    document.getElementById('statusMsg').innerHTML = "<span class='text-green-500 font-bold'>✅ 成功！</span>";
    document.getElementById('currentWeight').value = '';
    
    // 重新刷九宮格
    await refreshGrid(); 
}
        }

        async function refreshGrid() {
    const gridContainer = document.getElementById('gridContainer');
    if (!_client) return;

    // 1. 抓取小組內所有成員
    const { data: members, error: profileErr } = await _client
        .from('profiles')
        .select('*')
        .eq('group_code', groupCode);

    if (profileErr) return;

    // 2. 獲取每個成員的最新體重並計算減重差值
    const memberResults = await Promise.all(members.map(async (member) => {
        const { data: weightData } = await _client
            .from('weight_logs')
            .select('weight')
            .eq('user_id', member.id)
            .order('created_at', { ascending: false })
            .limit(1);

        const latestWeight = (weightData && weightData.length > 0) ? weightData[0].weight : null;
        const initialWeight = member.initial_weight;
        
        // 計算減重差值 (例如：70 - 72 = -2，代表瘦了 2 公斤)
        const diff = (latestWeight && initialWeight) ? (latestWeight - initialWeight) : 0;

        return {
            ...member,
            latestWeight,
            diff: parseFloat(diff.toFixed(1))
        };
    }));

    // 3. 【核心邏輯】按照減重幅度排序 (負值越大的排越前面，例如 -3kg > -1kg > 0kg)
    memberResults.sort((a, b) => a.diff - b.diff);

    // 4. 開始渲染
    gridContainer.innerHTML = ''; 

    for (let i = 0; i < 9; i++) {
        const member = memberResults[i];
        const card = document.createElement('div');
        card.className = "bg-white aspect-square flex flex-col items-center justify-center p-1 rounded-xl shadow-sm border-2 transition-all duration-500";
        
        if (member) {
            const diff = member.diff;
            let diffHtml = '<div class="text-[10px] text-gray-300">等待中</div>';
            let crownHtml = ''; // 冠軍皇冠

            // 第一名加個小皇冠標誌
            if (i === 0 && diff < 0) {
                crownHtml = '<div class="absolute -top-1 -right-1 text-lg">👑</div>';
                card.classList.add('relative');
            }

            if (member.latestWeight !== null) {
                const color = diff < 0 ? 'text-green-500 font-bold' : (diff > 0 ? 'text-red-400' : 'text-gray-400');
                const icon = diff < 0 ? '↓' : (diff > 0 ? '↑' : '-');
                diffHtml = `<div class="text-[11px] ${color}">${icon} ${Math.abs(diff)}kg</div>`;
            }

            const avatar = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(member.username)}`;
            card.innerHTML = `
                ${crownHtml}
                <img src="${avatar}" class="w-8 h-8 rounded-full mb-1 shadow-inner">
                <div class="text-[10px] font-bold text-gray-700 truncate w-full text-center">${member.username}</div>
                <div class="text-sm font-black text-blue-600">${member.latestWeight || '--'}</div>
                ${diffHtml}
            `;
            
            if (member.id === userId) {
                card.classList.add('border-blue-400', 'bg-blue-50', 'z-10');
            } else {
                card.classList.add('border-transparent');
            }
        } else {
            card.innerHTML = `<div class="text-gray-200 text-[20px]">+</div>`;
            card.classList.add('border-transparent', 'bg-gray-50/50');
        }
        gridContainer.appendChild(card);
    }
}
    </script>
