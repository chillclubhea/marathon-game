    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'PingFang TC', sans-serif; }
        input { user-select: auto; }
        
        /* 彈窗背景模糊動畫 */
        .modal-overlay { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); transition: all 0.3s ease; }
        .modal-content { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-hidden { opacity: 0; pointer-events: none; }
        .modal-hidden .modal-content { transform: scale(0.8) translateY(30px); }

        /* 敲碗震動動畫 */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-5deg); }
            50% { transform: translateX(2px) rotate(5deg); }
            100% { transform: translateX(0); }
        }
        .bell-active { animation: shake 0.3s ease-in-out; background-color: #fef3c7 !important; color: #d97706 !important; }

        /* 頭像呼吸燈動畫 */
        @keyframes breath {
            0% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
            50% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
            100% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
        }
        .status-pulse { animation: breath 2s infinite; }

        /* 新增加的動畫 */
        @keyframes newSessionPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }
        .new-session-notice { animation: newSessionPulse 2s infinite; }
        
        /* 新屆開始閃爍動畫 */
        @keyframes sessionStart {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .session-start { animation: sessionStart 1s ease-in-out 3; }
    </style>
</head>

        };

        // --- 天數計算核心函數（修正版）---
        function getChallengeInfo() {
            const today = new Date();
            
            // 從 localStorage 讀取或生成開始日期
            let startDateStr = localStorage.getItem('challenge_start_date');
            if (!startDateStr) {
                // 如果沒有設定開始日期，設定為昨天（讓今天是第15天）
                const startDate = new Date();
                startDate.setDate(today.getDate() - 14); // 從14天前開始（這樣今天就是第15天）
                startDateStr = startDate.toISOString().split('T')[0];
                localStorage.setItem('challenge_start_date', startDateStr);
            }
            
            const startDate = new Date(startDateStr);
            const diffTime = today - startDate;
            const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1; // 從1開始計
            
            // 計算當前第幾屆
            const sessionNumber = Math.ceil(totalDays / CHALLENGE_DURATION);
            const dayInSession = totalDays % CHALLENGE_DURATION || CHALLENGE_DURATION;
            
            // 計算本屆開始日期
            const sessionStartDate = new Date(startDate);
            sessionStartDate.setDate(startDate.getDate() + (sessionNumber - 1) * CHALLENGE_DURATION);
            
            // 檢查是否為休息日（第7天和第14天）
            const isRestDay = dayInSession === 7 || dayInSession === 14;
            const isLastDay = dayInSession === CHALLENGE_DURATION;
            
            return {
                totalDays: totalDays,
                dayInSession: dayInSession,
                sessionNumber: sessionNumber,
                sessionStartDate: sessionStartDate,
                isRestDay: isRestDay,
                isLastDay: isLastDay
            };
        }

        // --- 新屆開始模態框 ---
        function showNewSessionModal(sessionNumber) {
            document.getElementById('newSessionNumber').textContent = sessionNumber;
            document.getElementById('newSessionStartDay').textContent = 1;
            document.getElementById('newSessionModal').classList.remove('modal-hidden');
        }

        function closeNewSessionModal() {
            document.getElementById('newSessionModal').classList.add('modal-hidden');
        }

        // --- 更新天數顯示 ---
        function updateDayDisplay() {
            const challengeInfo = getChallengeInfo();
            const dayElement = document.getElementById('currentDay');
            const totalDaysElement = document.getElementById('totalDays');
            const badgeElement = document.getElementById('dayStatusBadge');
            const messageElement = document.getElementById('dayMessage');
            const sessionBadgeElement = document.getElementById('sessionBadge');
            const sessionStartDateElement = document.getElementById('sessionStartDate');
            const totalChallengeDaysElement = document.getElementById('totalChallengeDays');
            
            // 更新天數
            dayElement.textContent = challengeInfo.dayInSession;
            totalDaysElement.textContent = `/ ${CHALLENGE_DURATION} 天`;
            
            // 更新總天數
            totalChallengeDaysElement.textContent = challengeInfo.totalDays;
            
            // 更新本屆開始日期
            const startDateFormatted = challengeInfo.sessionStartDate.toLocaleDateString('zh-TW', {
                month: 'long',
                day: 'numeric'
            });
            sessionStartDateElement.textContent = startDateFormatted;
            
            // 更新屆數標籤
            sessionBadgeElement.textContent = `第 ${challengeInfo.sessionNumber} 屆`;
            
            // 根據狀態更新標籤和訊息
            if (challengeInfo.isRestDay) {
                badgeElement.textContent = "休息日";
                badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-yellow-100 text-yellow-800";
                messageElement.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-yellow-500">🏖️</span>
                        <span>今天是休息日，放鬆一下，明天繼續努力！</span>
                    </div>
                `;
            } else if (challengeInfo.isLastDay) {
                badgeElement.textContent = "最後一天";
                badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-purple-100 text-purple-800 new-session-notice";
                messageElement.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-purple-500">🎉</span>
                        <span>恭喜完成本屆挑戰！明天將是新一屆的開始！</span>
                    </div>
                `;
            } else {
                badgeElement.textContent = "挑戰中";
                badgeElement.className = "text-xs px-3 py-1 rounded-full font-bold bg-green-100 text-green-800";
                messageElement.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-green-500">🔥</span>
                        <span>持續努力，離目標越來越近了！</span>
                    </div>
                `;
            }
            
            // 如果是第15天（第2屆第1天），顯示新屆提示
            if (challengeInfo.totalDays === 15 && challengeInfo.sessionNumber === 2 && challengeInfo.dayInSession === 1) {
                setTimeout(() => {
                    showNewSessionModal(2);
                }, 1000);
            }
        }

        function getTodayString() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        // 彈窗控制
        function openModal() {
            const challengeInfo = getChallengeInfo();
            const dayInSession = challengeInfo.dayInSession;
            
            // 優先使用總天數的內容，如果沒有則使用本屆天數
            const data = DAILY_CONTENT[challengeInfo.totalDays] || DAILY_CONTENT[dayInSession] || { 
                title: "持續加油！", 
                content: "每一天的堅持都是為了更棒的體態。", 
                tips: "保持記錄，你正走在正確的道路上。", 
                img: "" 
            };
            
            document.getElementById('modalSession').textContent = challengeInfo.sessionNumber;
            document.getElementById('modalDay').innerText = dayInSession;
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalText').innerText = data.content;
            document.getElementById('modalTips').innerText = data.tips;
            
            const imgBox = document.getElementById('modalImage');
            if (data.img) {
                imgBox.innerHTML = `<img src="${data.img}" class="w-full h-full object-cover rounded-xl">`;
            } else {
                imgBox.innerHTML = `<div class="text-center"><span class="text-4xl mb-2">📚</span><br><span>第 ${challengeInfo.sessionNumber} 屆 第 ${dayInSession} 天</span></div>`;
            }

            document.getElementById('infoModal').classList.remove('modal-hidden');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('modal-hidden');
        }

        // 倒數計時功能
        function updateCountdown() {
            const now = new Date();
            const deadline = new Date();
            deadline.setHours(23, 59, 59, 999);
            const diff = deadline - now;
            if (diff <= 0) {
                document.getElementById('countdownText').innerText = "今日報數截止";
                return;
            }
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('countdownText').innerText = `截止倒數 ${h}:${m}:${s}`;
        }
        setInterval(updateCountdown, 1000);

        // --- 修正的送出體重函數 ---
        async function submitWeight() {
            const challengeInfo = getChallengeInfo();
            
            // 檢查是否為休息日
            if (challengeInfo.isRestDay) {
                alert("今天是休息日，好好放鬆一下吧！明天再繼續報數。");
                return;
            }
            
            const weightVal = document.getElementById('currentWeight').value;
            if (!weightVal) {
                alert("請輸入體重數據！");
                return;
            }
            
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "上傳中...";

            // 簡化的插入語句，不包含 session_number 和 day_in_session
            const { error } = await _client.from('weight_logs').insert([{ 
                user_id: userId, 
                weight: parseFloat(weightVal)
            }]);
            
            if (!error) {
                document.getElementById('statusMsg').innerHTML = `<div class="text-green-600 font-bold animate-bounce">✅ 報數成功！</div>`;
                document.getElementById('currentWeight').value = '';
                refreshGrid();
                // 報數成功後開啟知識彈窗
                setTimeout(openModal, 500);
            } else {
                alert("報數失敗，請檢查網路！");
                console.error(error);
            }
            
            btn.disabled = false;
            btn.innerText = "送出數據並看知識";
        }

        // --- 修正的提醒隊友函數 ---
        async function sendReminder(targetId, btnElement) {
            const challengeInfo = getChallengeInfo();
            if (challengeInfo.isRestDay) {
                alert("今天是休息日，讓隊友好好休息吧！");
                return;
            }
            
            btnElement.classList.add('bell-active');
            btnElement.innerText = "⌛...";
            
            // 簡化的插入語句
            const { error } = await _client.from('reminders').insert([{ 
                from_name: myUsername, 
                to_user_id: targetId
            }]);
            
            if(!error) {
                btnElement.innerText = "✅ 已提醒";
                setTimeout(() => {
                    btnElement.classList.remove('bell-active');
                    btnElement.innerText = "🔔 催一下";
                }, 1500);
            } else {
                btnElement.innerText = "❌ 失敗";
                setTimeout(() => {
                    btnElement.classList.remove('bell-active');
                    btnElement.innerText = "🔔 催一下";
                }, 1500);
            }
        }

        // --- 修正的檢查提醒函數 ---
        async function checkReminders() {
            const { data } = await _client.from('reminders')
                .select('id, from_name')
                .eq('to_user_id', userId)
                .eq('is_read', false);
                
            if (data && data.length > 0) {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                const names = [...new Set(data.map(r => r.from_name))].join('、');
                alert(`🔔 隊友 [${names}] 正在提醒你報數喔！🏃‍♂️`);
                await _client.from('reminders').update({ is_read: true }).in('id', data.map(r => r.id));
            }
        }

        // --- 修正的刷新小組戰報函數 ---
        async function refreshGrid() {
            const challengeInfo = getChallengeInfo();
            const todayStr = getTodayString();
            const { data: members } = await _client.from('profiles').select('*').eq('group_code', groupCode);
            if (!members) return;

            let reportCount = 0;
            const grid = document.getElementById('gridContainer');
            
            const results = await Promise.all(members.map(async (m) => {
                // 查詢今天的報數記錄（不使用 session_number 和 day_in_session）
                const { data: logs } = await _client.from('weight_logs')
                    .select('weight, created_at')
                    .eq('user_id', m.id)
                    .gte('created_at', todayStr + 'T00:00:00')
                    .lt('created_at', todayStr + 'T23:59:59')
                    .order('created_at', { ascending: false })
                    .limit(1);

                const latestLog = logs?.[0];
                
                // 查詢昨天的報數記錄
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];
                
                const { data: prevLogs } = await _client.from('weight_logs')
                    .select('weight')
                    .eq('user_id', m.id)
                    .gte('created_at', yesterdayStr + 'T00:00:00')
                    .lt('created_at', yesterdayStr + 'T23:59:59')
                    .limit(1);

                const hasReportedToday = challengeInfo.isRestDay ? true : (latestLog !== undefined);
                
                if (hasReportedToday && !challengeInfo.isRestDay) {
                    reportCount++;
                    if (m.id === userId) {
                        document.getElementById('myStatusDot').className = "absolute -bottom-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-white shadow-sm";
                    }
                }
                
                return { 
                    ...m, 
                    latest: latestLog?.weight, 
                    previous: prevLogs?.[0]?.weight, 
                    hasReportedToday 
                };
            }));

            // 更新進度條
            if (challengeInfo.isRestDay) {
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressText').innerText = `休息日`;
                document.getElementById('progressMotto').textContent = "💤 休息是為了走更長遠的路";
            } else {
                const progressPercent = (reportCount / members.length * 100);
                document.getElementById('progressBar').style.width = progressPercent + '%';
                document.getElementById('progressText').innerText = `${reportCount} / ${members.length}`;
                
                // 根據進度更新格言
                if (progressPercent >= 80) {
                    document.getElementById('progressMotto').textContent = "🔥 團隊力量大，快完成了！";
                } else if (progressPercent >= 50) {
                    document.getElementById('progressMotto').textContent = "💪 過半了，繼續保持！";
                } else {
                    document.getElementById('progressMotto').textContent = "✨ 堅持，是為了看見更好的自己";
                }
            }

            grid.innerHTML = '';
            results.forEach(m => {
                const isMe = m.id === userId;
                let diffHtml = '';
                
                const statusColor = challengeInfo.isRestDay ? 'bg-yellow-500' : (m.hasReportedToday ? 'bg-green-500' : 'bg-red-500 status-pulse');
                const avatarBorder = challengeInfo.isRestDay ? 'border-yellow-400 shadow-yellow-100' : (m.hasReportedToday ? 'border-blue-400 shadow-blue-100' : 'border-gray-300 opacity-70');

                if (challengeInfo.isRestDay) {
                    // 休息日顯示
                    diffHtml = `<span class="text-[10px] text-yellow-600 font-bold">🏖️ 休息</span>`;
                } else if (m.hasReportedToday) {
                    if (m.previous) {
                        const diff = (m.latest - m.previous).toFixed(1);
                        if (diff < 0) {
                            diffHtml = `<span class="text-green-500 font-bold text-[10px]">⬇️${Math.abs(diff)}</span>`;
                        } else if (diff > 0) {
                            diffHtml = `<span class="text-red-400 font-bold text-[10px]">⬆️${diff}</span>`;
                        } else {
                            diffHtml = `<span class="text-gray-400 text-[10px]">持平</span>`;
                        }
                    } else {
                        // 沒有前一天記錄
                        diffHtml = `<span class="text-blue-400 text-[10px] font-bold">START</span>`;
                    }
                } else {
                    // 還沒報數
                    if (!isMe) {
                        diffHtml = `<button onclick="sendReminder('${m.id}', this)" class="mt-1 bg-white text-gray-600 text-[10px] px-2 py-1 rounded-lg border border-gray-200 shadow-sm font-bold active:scale-90 transition-all">🔔 催一下</button>`;
                    } else {
                        diffHtml = `<span class="text-[10px] text-gray-400 font-bold">等待中</span>`;
                    }
                }

                const card = document.createElement('div');
                card.className = `relative flex flex-col items-center justify-center p-2 rounded-2xl transition-all ${isMe ? 'bg-white shadow-md ring-2 ring-blue-400' : 'bg-white/60'}`;
                card.innerHTML = `
                    <div class="relative mb-2">
                        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(m.username)}" 
                             class="w-10 h-10 rounded-xl bg-gray-50 border-2 ${avatarBorder} shadow-sm">
                        <div class="absolute -bottom-1 -right-1 w-3 h-3 ${statusColor} rounded-full border-2 border-white shadow-sm"></div>
                    </div>
                    <div class="text-[10px] font-black text-gray-700 truncate w-full text-center mb-0.5">${m.username}${isMe ? ' (我)' : ''}</div>
                    <div class="text-xs font-black ${challengeInfo.isRestDay ? 'text-yellow-600' : (m.hasReportedToday ? 'text-blue-600' : 'text-gray-300')}">
                        ${challengeInfo.isRestDay ? '--' : (m.hasReportedToday ? (m.latest?.toFixed(1) || '--') : '--')}
                    </div>
                    <div class="mt-1">${diffHtml}</div>
                `;
                grid.appendChild(card);
            });
        }

        // 頁面載入
        window.onload = async () => {
            if (!userId) { 
                window.location.href = "index.html"; 
                return; 
            }
            
            // 更新天數顯示
            updateDayDisplay();
            
            // 獲取使用者資料
            const { data } = await _client.from('profiles').select('username').eq('id', userId).single();
            if (data) {
                document.getElementById('displayUsername').innerText = data.username;
                document.getElementById('myAvatar').src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(data.username)}`;
                myUsername = data.username;
            }
            
            document.getElementById('groupLabel').innerText = "GROUP: " + groupCode;

            // 如果是新屆第一天，顯示歡迎訊息
            const challengeInfo = getChallengeInfo();
            const todayStr = getTodayString();
            const lastSeen = localStorage.getItem('last_seen_info_date');
            
            // 如果是第15天（第2屆第1天），顯示新屆提示
            if (challengeInfo.totalDays === 15 && challengeInfo.sessionNumber === 2 && challengeInfo.dayInSession === 1) {
                const hasSeenSession2 = localStorage.getItem('has_seen_session_2');
                if (!hasSeenSession2) {
                    setTimeout(() => {
                        showNewSessionModal(2);
                        localStorage.setItem('has_seen_session_2', 'true');
                    }, 1500);
                }
            } else if (lastSeen !== todayStr && !challengeInfo.isRestDay) {
                // 非休息日，自動顯示今日知識
                localStorage.setItem('last_seen_info_date', todayStr);
                setTimeout(openModal, 1500);
            }

            // 啟動計時器和更新
            updateCountdown(); 
            refreshGrid();
            checkReminders();
            
            // 每30秒檢查一次提醒
            setInterval(checkReminders, 30000);
            // 每分鐘刷新一次戰報
            setInterval(refreshGrid, 60000);
            
            // 自動將輸入框焦點
            setTimeout(() => {
                document.getElementById('currentWeight').focus();
            }, 1000);
        };
    </script>
