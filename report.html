<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3663/3663335.png">
    <meta name="apple-mobile-web-app-title" content="馬拉松報數">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日報數 - 馬拉松挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'PingFang TC', sans-serif; }
        input { user-select: auto; }
        
        /* 彈窗背景模糊動畫 */
        .modal-overlay { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s ease, opacity 0.3s ease; }
        .modal-hidden { opacity: 0; pointer-events: none; }
        .modal-hidden .modal-content { transform: scale(0.9) translateY(20px); }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-5deg); }
            50% { transform: translateX(2px) rotate(5deg); }
            100% { transform: translateX(0); }
        }
        .bell-active { animation: shake 0.3s ease-in-out; background-color: #fef3c7 !important; color: #d97706 !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto mb-6 bg-white rounded-3xl p-5 shadow-sm border border-blue-50">
        <div class="flex justify-between items-center mb-3">
            <span class="text-sm font-bold text-gray-600 flex items-center gap-1">
                <span class="w-2 h-2 bg-blue-500 rounded-full"></span> 全隊今日進度
            </span>
            <span id="countdownText" class="text-[10px] bg-red-50 text-red-500 px-2 py-1 rounded-lg font-mono font-bold">倒數 --:--:--</span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden mb-2">
            <div id="progressBar" class="bg-gradient-to-r from-blue-400 to-indigo-600 h-full transition-all duration-1000" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center">
            <p class="text-[10px] text-gray-400 font-medium">✨ 堅持，是為了看見更好的自己</p>
            <span id="progressText" class="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">0 / 0</span>
        </div>
    </div>

    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-6 mb-8 border-b-8 border-blue-500/10 text-center">
        <div class="relative inline-block mb-2">
            <img id="myAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=me" class="w-16 h-16 rounded-2xl bg-gray-100 p-1 border-2 border-white shadow-md">
            <div id="myStatusDot" class="absolute -bottom-1 -right-1 bg-gray-300 w-4 h-4 rounded-full border-2 border-white"></div>
        </div>
        <h2 id="displayUsername" class="text-xl font-black text-gray-800 mb-5">載入中...</h2>
        
        <div class="space-y-4">
            <div class="relative">
                <input type="number" id="currentWeight" step="0.1" inputmode="decimal" class="block w-full text-center text-4xl font-black border-2 border-gray-100 rounded-2xl py-5 focus:border-blue-500 focus:outline-none" placeholder="00.0">
                <span class="absolute right-6 top-1/2 -translate-y-1/2 text-gray-400 font-bold">kg</span>
            </div>
            <button onclick="submitWeight()" id="btnSubmit" class="w-full bg-blue-600 text-white text-lg font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all">送出數據並看知識</button>
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <div id="gridContainer" class="grid grid-cols-3 gap-3 bg-gray-100 p-3 rounded-3xl shadow-inner min-h-[300px]"></div>
    </div>

    <div id="infoModal" class="fixed inset-0 z-50 flex items-center justify-center p-6 modal-overlay modal-hidden">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] overflow-hidden shadow-2xl modal-content">
            <div class="relative p-8">
                <div class="text-blue-600 font-black text-xs tracking-widest mb-2 uppercase">Day <span id="modalDay">--</span> Knowledge</div>
                <h3 id="modalTitle" class="text-2xl font-black text-gray-800 mb-4 leading-tight"></h3>
                <div id="modalImage" class="mb-4 rounded-2xl overflow-hidden shadow-sm"></div>
                <p id="modalText" class="text-gray-600 text-sm leading-relaxed mb-6"></p>
                <div class="bg-blue-50 p-4 rounded-2xl border-l-4 border-blue-400 mb-6">
                    <p class="text-[10px] font-bold text-blue-800 uppercase">💡 管理師建議</p>
                    <p id="modalTips" class="text-xs text-blue-700 mt-1 font-bold"></p>
                </div>
                <button onclick="closeModal()" class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl active:scale-95 transition-all">我知道了，繼續加油</button>
            </div>
        </div>
    </div>

    <script>
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        const userId = localStorage.getItem('my_user_id');
        const groupCode = localStorage.getItem('my_group_code');
        const START_DATE = '2026-01-01';

        // 知識庫內容 (可視需求同步 report.html)
        const DAILY_CONTENT = {
            4: { title: "🍎 認識「偽食慾」", content: "大腦有時分不清楚「渴」與「餓」。當你想吃甜點時，其實你是缺水或缺營養了。", tips: "想吃零食前，先喝 200ml 草本茶，等 10 分鐘看看！", img: "https://api.dicebear.com/7.x/shapes/svg?seed=day4" },
            // ... 其他天數
        };

        function getChallengeDay() {
            const diff = new Date().setHours(0,0,0,0) - new Date(START_DATE).setHours(0,0,0,0);
            return Math.ceil(diff / (1000 * 60 * 60 * 24)) + 1;
        }

        async function submitWeight() {
            const weightVal = document.getElementById('currentWeight').value;
            if (!weightVal) return alert("請輸入體重");
            
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "上傳中...";

            const { error } = await _client.from('weight_logs').insert([{ user_id: userId, weight: parseFloat(weightVal) }]);
            
            if (!error) {
                refreshGrid();
                openModal(); // 報磅成功後，自動彈出框框
            } else {
                alert("上傳失敗，請重試");
            }
            btn.disabled = false;
            btn.innerText = "送出數據並看知識";
        }

        function openModal() {
            const day = getChallengeDay();
            const data = DAILY_CONTENT[day] || { title: "持續堅持！", content: "每一天的努力都在雕刻更好的自己。", tips: "記得喝足 2500cc 的水！" };
            
            document.getElementById('modalDay').innerText = day;
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalText').innerText = data.content;
            document.getElementById('modalTips').innerText = data.tips;
            if(data.img) document.getElementById('modalImage').innerHTML = `<img src="${data.img}" class="w-full h-32 object-cover">`;

            document.getElementById('infoModal').classList.remove('modal-hidden');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('modal-hidden');
        }

        async function refreshGrid() {
            const todayStr = new Date().toLocaleDateString('en-CA');
            const { data: members } = await _client.from('profiles').select('*').eq('group_code', groupCode);
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            
            for (const m of members) {
                const { data: logs } = await _client.from('weight_logs').select('*').eq('user_id', m.id).order('created_at', { ascending: false }).limit(1);
                const hasReported = logs?.[0] && new Date(logs[0].created_at).toLocaleDateString('en-CA') === todayStr;
                
                const card = document.createElement('div');
                card.className = `flex flex-col items-center p-3 rounded-2xl bg-white ${m.id === userId ? 'ring-2 ring-blue-400' : ''}`;
                card.innerHTML = `
                    <div class="relative mb-2">
                        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${m.username}" class="w-10 h-10 rounded-xl bg-gray-100 border ${hasReported ? 'border-green-400' : 'border-gray-200'}">
                        <div class="absolute -bottom-1 -right-1 w-3 h-3 ${hasReported ? 'bg-green-500' : 'bg-red-500'} rounded-full border-2 border-white"></div>
                    </div>
                    <div class="text-[10px] font-bold text-gray-500">${m.username}</div>
                    <div class="text-xs font-black ${hasReported ? 'text-blue-600' : 'text-gray-300'}">${hasReported ? logs[0].weight : '--'}</div>
                `;
                grid.appendChild(card);
            }
        }

        window.onload = async () => {
            if (!userId) return window.location.href = "index.html";
            const { data } = await _client.from('profiles').select('username').eq('id', userId).single();
            if (data) document.getElementById('displayUsername').innerText = data.username;
            refreshGrid();
        };
    </script>
</body>
</html>
