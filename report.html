<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3663/3663335.png">
    <meta name="apple-mobile-web-app-title" content="馬拉松報數">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日報數 - 馬拉松挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'PingFang TC', sans-serif; }
        input { user-select: auto; }

        /* 彈窗背景模糊動畫 */
        .modal-overlay { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); transition: all 0.3s ease; }
        .modal-content { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-hidden { opacity: 0; pointer-events: none; }
        .modal-hidden .modal-content { transform: scale(0.8) translateY(30px); }

        /* 敲碗震動動畫 */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-5deg); }
            50% { transform: translateX(2px) rotate(5deg); }
            100% { transform: translateX(0); }
        }
        .bell-active { animation: shake 0.3s ease-in-out; background-color: #fef3c7 !important; color: #d97706 !important; }

        /* 頭像呼吸燈動畫 */
        @keyframes breath {
            0% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
            50% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
            100% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
        }
        .status-pulse { animation: breath 2s infinite; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto mb-6 bg-white rounded-3xl p-5 shadow-sm border border-blue-50">
        <div class="flex justify-between items-center mb-3">
            <span class="text-sm font-bold text-gray-600 flex items-center gap-1">
                <span class="w-2 h-2 bg-blue-500 rounded-full"></span> 全隊今日進度
            </span>
            <span id="countdownText" class="text-[10px] bg-red-50 text-red-500 px-2 py-1 rounded-lg font-mono font-bold border border-red-100">倒數 --:--:--</span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden mb-2">
            <div id="progressBar" class="bg-gradient-to-r from-blue-400 to-indigo-600 h-full transition-all duration-1000 shadow-inner" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center">
            <p id="progressMotto" class="text-[10px] text-gray-400 font-medium">✨ 堅持，是為了看見更好的自己</p>
            <span id="progressText" class="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">0 / 0</span>
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-3xl shadow-xl p-6 mb-8 border-b-8 border-blue-500/10 text-center">
            <div id="userInfo" class="mb-5 text-center">
                <div class="relative inline-block mb-2">
                    <img id="myAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=me" class="w-16 h-16 rounded-2xl bg-gray-100 p-1 border-2 border-white shadow-md">
                    <div id="myStatusDot" class="absolute -bottom-1 -right-1 bg-gray-300 w-4 h-4 rounded-full border-2 border-white shadow-sm"></div>
                </div>
                <h2 id="displayUsername" class="text-xl font-black text-gray-800 tracking-tight">載入中...</h2>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <input type="number" id="currentWeight" step="0.1" inputmode="decimal" class="block w-full text-center text-4xl font-black border-2 border-gray-100 rounded-2xl py-5 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:outline-none transition-all placeholder:text-gray-200" placeholder="00.0">
                    <span class="absolute right-6 top-1/2 -translate-y-1/2 text-gray-400 font-bold">kg</span>
                </div>
                <button onclick="submitWeight()" id="btnSubmit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-lg font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 active:scale-[0.98] transition-all">送出數據並看知識</button>
            </div>
            <div id="statusMsg" class="mt-4 text-center text-sm"></div>
        </div>

        <div class="mb-4 flex justify-between items-center px-1">
            <h3 class="text-lg font-black text-gray-800 tracking-tight">🏆 小組戰報</h3>
            <span id="groupLabel" class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-lg font-bold"></span>
        </div>
        <div id="gridContainer" class="grid grid-cols-3 gap-3 bg-gray-100 p-3 rounded-3xl shadow-inner min-h-[300px]"></div>
    </div>

    <div id="infoModal" class="fixed inset-0 z-50 flex items-center justify-center p-6 modal-overlay modal-hidden">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] overflow-hidden shadow-2xl modal-content">
            <div class="relative p-8 text-center">
                <div class="inline-flex items-center bg-blue-600 text-white px-4 py-1 rounded-full text-[10px] font-black tracking-widest mb-6">
                    DAY <span id="modalDay" class="ml-1">--</span> KNOWLEDGE
                </div>

                <h3 id="modalTitle" class="text-2xl font-black text-gray-800 mb-4 leading-tight"></h3>

                <div id="modalImage" class="mb-6 rounded-2xl overflow-hidden shadow-sm aspect-video bg-gray-100 flex items-center justify-center text-gray-400">
                    </div>

                <p id="modalText" class="text-gray-600 text-sm leading-relaxed mb-8 text-left"></p>

                <div class="bg-blue-50 p-5 rounded-2xl border-l-4 border-blue-400 mb-8 text-left">
                    <p class="text-[10px] font-black text-blue-600 uppercase tracking-wider mb-1">💡 COACH TIPS</p>
                    <p id="modalTips" class="text-xs text-blue-800 font-bold leading-normal"></p>
                </div>

                <button onclick="closeModal()" class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl active:scale-95 transition-all shadow-lg">
                    我知道了，繼續加油
                </button>
            </div>
        </div>
    </div>

    <script>
        const MY_SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        const { createClient } = supabase;
        const _client = createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        const userId = localStorage.getItem('my_user_id');
        const groupCode = localStorage.getItem('my_group_code');
        const START_DATE = '2026-01-01'; // 挑戰開始日
        let myUsername = "我";

        // --- 健康知識資料庫 ---
        const DAILY_CONTENT = {
            1: { title: "🌱 啟動細胞營養", content: "減重 80% 靠營養。今天起我們用「三杯水」開啟代謝：蘆薈汁清、草本茶調、奶昔補。", tips: "早起先喝 3 瓶蓋蘆薈汁兌水，喚醒腸道吸收力！", img: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=400" },
            2: { title: "🌙 睡眠竟然也能瘦？", content: "熬夜會分泌皮質醇，囤積腹部脂肪。乖乖睡覺會分泌「瘦體素」，幫你自動燒脂。", tips: "晚上 11 點前請放下手機，睡滿 7 小時。", img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=400" },
            3: { title: "💧 水是脂肪搬運工", content: "沒有水，脂肪就排不出去。水分充足時，大腦才會下令啟動能量代謝。", tips: "今天目標：喝足 3000cc 水分！", img: "https://images.unsplash.com/photo-1523362628744-4cdd05167aa2?auto=format&fit=crop&w=400" },
            4: { title: "🍎 認識「偽食慾」", content: "大腦有時分不清楚渴與餓。想吃甜點時，通常只是身體缺水或缺營養了。", tips: "想吃零食前，先喝 200ml 水並等 10 分鐘。", img: "https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&w=400" },
            5: { title: "💩 腸道排毒日", content: "排便不順體重會卡關。纖維粉是腸道的掃把，能帶走宿便與油脂。", tips: "今天可以在奶昔中多加一匙活動纖維粉。", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=400" }
            5: { title: "💩 腸道排毒日", content: "排便不順體重會卡關。纖維粉是腸道的掃把，能帶走宿便與油脂。", tips: "今天可以在奶昔中多加一匙活動纖維粉。", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=400" },
            // --- 新增 6 到 10 天 ---
            6: { 
                title: "🥩 蛋白質的魔力", 
                content: "蛋白質是肌肉的原料，更是提升「基礎代謝率」的關鍵。攝取不足會讓身體流失肌肉，導致復胖。", 
                tips: "每餐確保有一份掌心大小的優質蛋白（如：雞蛋、豆漿、優質蛋白粉）。", 
                img: "https://images.unsplash.com/photo-1558163351-db445733553d?auto=format&fit=crop&w=400" 
            },
            7: { 
                title: "🧂 隱形的體重殺手", 
                content: "太鹹的食物會導致「鈉滯留」，讓身體儲存過多水分，這就是為什麼有時吃完大餐隔天體重暴增的原因。", 
                tips: "今天嘗試「清淡飲食」，減少加工醬料，多吃原型蔬菜排鈉。", 
                img: "https://images.unsplash.com/photo-1506084868730-342b1f852e0d?auto=format&fit=crop&w=400" 
            },
            8: { 
                title: "🔥 間歇性的小運動", 
                content: "不需要長時間激烈運動，每天快走 15 分鐘或爬樓梯，就能有效啟動血液循環，幫助燃脂效果加倍。", 
                tips: "今天請給自己 15 分鐘，動動身體流點汗吧！", 
                img: "https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=400" 
            },
            9: { 
                title: "🧘‍♀️ 壓力與脂肪的關係", 
                content: "壓力大時會產生壓力荷爾蒙，這會傾向於將脂肪囤積在腹部。學習放鬆也是減重的一部分。", 
                tips: "今天深呼吸 5 分鐘，或者找隊友吐苦水，保持心情愉快！", 
                img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=400" 
            },
            10: { 
                title: "🏁 第一階段的小總結", 
                content: "來到第 10 天了！這是一個習慣養成的里程碑。不論數字變化如何，你的身體細胞已經變得更健康了。", 
                tips: "回顧前 9 天你最自豪的進步，並在群組跟隊友分享！", 
                img: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=400" 
            }
        };

        function getTodayString() {
            return new Date().toLocaleDateString('en-CA');
        }

        function getChallengeDay() {
            const start = new Date(START_DATE).setHours(0,0,0,0);
            const now = new Date().setHours(0,0,0,0);
            const diff = Math.ceil((now - start) / (1000 * 60 * 60 * 24)) + 1;
            return diff > 0 ? diff : 1;
        }

        // 彈窗控制
        function openModal() {
            const day = getChallengeDay();
            const data = DAILY_CONTENT[day] || { title: "持續加油！", content: "每一天的堅持都是為了更棒的體態。", tips: "保持記錄，你正走在正確的道路上。", img: "" };

            document.getElementById('modalDay').innerText = day;
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalText').innerText = data.content;
            document.getElementById('modalTips').innerText = data.tips;

            const imgBox = document.getElementById('modalImage');
            if (data.img) {
                imgBox.innerHTML = `<img src="${data.img}" class="w-full h-full object-cover">`;
            } else {
                imgBox.innerHTML = `<span>Day ${day}</span>`;
            }

            document.getElementById('infoModal').classList.remove('modal-hidden');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('modal-hidden');
        }

        // 倒數計時功能
        function updateCountdown() {
            const now = new Date();
            const deadline = new Date();
            deadline.setHours(23, 59, 59, 999);
            const diff = deadline - now;
            if (diff <= 0) {
                document.getElementById('countdownText').innerText = "今日報數截止";
                return;
            }
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('countdownText').innerText = `截止倒數 ${h}:${m}:${s}`;
        }
        setInterval(updateCountdown, 1000);

        // 送出體重
        async function submitWeight() {
            const weightVal = document.getElementById('currentWeight').value;
            if (!weightVal) {
                alert("請輸入體重數據！");
                return;
            }
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "上傳中...";

            const { error } = await _client.from('weight_logs').insert([{ user_id: userId, weight: parseFloat(weightVal) }]);

            if (!error) {
                document.getElementById('statusMsg').innerHTML = `<div class="text-green-600 font-bold animate-bounce">✅ 報數成功！</div>`;
                refreshGrid();
                // --- 重點：報磅成功後開啟彈窗 ---
                openModal();
            } else {
                alert("報數失敗，請檢查網路！");
            }
            btn.disabled = false;
            btn.innerText = "送出數據並看知識";
        }

        // 提醒隊友
        async function sendReminder(targetId, btnElement) {
            btnElement.classList.add('bell-active');
            btnElement.innerText = "⌛...";
            const { error } = await _client.from('reminders').insert([{ from_name: myUsername, to_user_id: targetId }]);
            if(!error) {
                btnElement.innerText = "✅ 已提醒";
                setTimeout(() => {
                    btnElement.classList.remove('bell-active');
                    btnElement.innerText = "🔔 催一下";
                }, 1500);
            }
        }

        // 檢查自己有沒有被提醒
        async function checkReminders() {
            const { data } = await _client.from('reminders').select('id, from_name').eq('to_user_id', userId).eq('is_read', false);
            if (data && data.length > 0) {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                const names = [...new Set(data.map(r => r.from_name))].join('、');
                alert(`🔔 隊友 [${names}] 正在提醒你報數喔！🏃‍♂️`);
                await _client.from('reminders').update({ is_read: true }).in('id', data.map(r => r.id));
            }
        }

        // 刷新小組戰報
        async function refreshGrid() {
            const todayStr = getTodayString();
            const { data: members } = await _client.from('profiles').select('*').eq('group_code', groupCode);
            if (!members) return;

            let reportCount = 0;
            const grid = document.getElementById('gridContainer');

            const results = await Promise.all(members.map(async (m) => {
                const { data: logs } = await _client.from('weight_logs')
                    .select('weight, created_at')
                    .eq('user_id', m.id)
                    .order('created_at', { ascending: false })
                    .limit(2);

                const latestLog = logs?.[0];
                const previousLog = logs?.[1];
                const hasReportedToday = latestLog && new Date(latestLog.created_at).toLocaleDateString('en-CA') === todayStr;

                if (hasReportedToday) {
                    reportCount++;
                    if (m.id === userId) {
                        document.getElementById('myStatusDot').className = "absolute -bottom-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-white shadow-sm";
                    }
                }
                return { ...m, latest: latestLog?.weight, previous: previousLog?.weight, hasReportedToday };
            }));

            document.getElementById('progressBar').style.width = (reportCount / members.length * 100) + '%';
            document.getElementById('progressText').innerText = `${reportCount} / ${members.length}`;

            grid.innerHTML = '';
            results.forEach(m => {
                const isMe = m.id === userId;
                let diffHtml = '';

                const statusColor = m.hasReportedToday ? 'bg-green-500' : 'bg-red-500 status-pulse';
                const avatarBorder = m.hasReportedToday ? 'border-blue-400 shadow-blue-100' : 'border-gray-300 opacity-70';

                if (m.hasReportedToday) {
                    if (m.previous) {
                        const diff = (m.latest - m.previous).toFixed(1);
                        diffHtml = diff < 0 ? `<span class="text-green-500 font-bold text-[10px]">⬇️${Math.abs(diff)}</span>` : (diff > 0 ? `<span class="text-red-400 font-bold text-[10px]">⬆️${diff}</span>` : `<span class="text-gray-400 text-[10px]">-</span>`);
                    } else {
                        diffHtml = `<span class="text-blue-400 text-[10px] font-bold">START</span>`;
                    }
                } else {
                    diffHtml = !isMe ? `<button onclick="sendReminder('${m.id}', this)" class="mt-1 bg-white text-gray-600 text-[10px] px-2 py-1 rounded-lg border border-gray-200 shadow-sm font-bold active:scale-90 transition-all">🔔 催一下</button>` : `<span class="text-[10px] text-gray-400 font-bold">WAITING</span>`;
                }

                const card = document.createElement('div');
                card.className = `relative flex flex-col items-center justify-center p-2 rounded-2xl transition-all ${isMe ? 'bg-white shadow-md ring-2 ring-blue-400' : 'bg-white/60'}`;
                card.innerHTML = `
                    <div class="relative mb-2">
                        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(m.username)}" 
                             class="w-10 h-10 rounded-xl bg-gray-50 border-2 ${avatarBorder} shadow-sm">
                        <div class="absolute -bottom-1 -right-1 w-3 h-3 ${statusColor} rounded-full border-2 border-white shadow-sm"></div>
                    </div>
                    <div class="text-[10px] font-black text-gray-700 truncate w-full text-center mb-0.5">${m.username}${isMe ? ' (我)' : ''}</div>
                    <div class="text-xs font-black ${m.hasReportedToday ? 'text-blue-600' : 'text-gray-300'}">
                        ${m.hasReportedToday ? m.latest : '--'}
                    </div>
                    <div class="mt-1">${diffHtml}</div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = async () => {
            if (!userId) { window.location.href = "index.html"; return; }

            const { data } = await _client.from('profiles').select('username').eq('id', userId).single();
            if (data) {
                document.getElementById('displayUsername').innerText = data.username;
                document.getElementById('myAvatar').src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(data.username)}`;
                myUsername = data.username;
            }
            document.getElementById('groupLabel').innerText = "GROUP: " + groupCode;

            // 如果今天還沒看過資訊，自動彈窗提醒（也可以選擇拿掉這段，僅在報磅後彈窗）
            const todayStr = getTodayString();
            const lastSeen = localStorage.getItem('last_seen_info_date');
            if (lastSeen !== todayStr) {
                localStorage.setItem('last_seen_info_date', todayStr);
                setTimeout(openModal, 1500);
            }

            updateCountdown(); 
            refreshGrid();
            checkReminders();
        };
    </script>
</body>
</html>
